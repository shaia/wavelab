module: 05-work-paths
questions:
  - id: Q-05-1
    type: multiple-choice
    objectives: [OBJ-05-1]
    misconception: heat-stored-in-body
    prompt: >-
      A cylinder of gas sits on a bench. Which question is meaningful, and which is not?
    choices:
      - text: "\"How much internal energy does it have?\" is meaningful; \"how much heat does it contain?\" is not."
        correct: true
        feedback: >-
          Correct. Internal energy is a state function, so the gas has a definite amount of it.
          Heat is one of the two ways energy crosses the boundary, so it belongs to a process,
          not to a state. A gas contains energy; it does not contain heat.
      - text: Both are meaningful — heat is simply the thermal part of the internal energy.
        correct: false
        feedback: >-
          There is no way to separate internal energy into a "thermal part" that arrived as
          heat and a "mechanical part" that arrived as work. Two identical gases in identical
          states may have been prepared by entirely different mixes of heating and compression.
      - text: Neither is meaningful, because both depend on the path taken.
        correct: false
        feedback: >-
          Internal energy does not depend on the path — that is exactly what makes it a state
          function, and it is why ΔU comes out the same for every route between two states.
      - text: "\"How much heat does it contain?\" is meaningful; \"how much internal energy?\" is not, because energy has no absolute zero."
        correct: false
        feedback: >-
          It is true that internal energy is measured from an arbitrary reference, but that
          affects only the zero point; differences are perfectly well defined. Heat, by
          contrast, has no state-function status at all, not even up to a constant.

  - id: Q-05-2
    type: multiple-choice
    objectives: [OBJ-05-1, OBJ-05-2]
    prompt: >-
      A gas is taken from state A to state B along two different quasistatic paths. Which
      statement is always true?
    choices:
      - text: ΔU is the same on both paths; W_on and Q may each differ, but their sum does not.
        correct: true
        feedback: >-
          Exactly. The first law ties the two path functions to one state function: whatever
          work fails to supply, heat must make up. This is the whole content of the module in
          one sentence.
      - text: W_on is the same on both paths, because the endpoints are the same.
        correct: false
        feedback: >-
          Work is the area under the path in the P-V plane, and different paths between the
          same endpoints enclose different areas. For the standard example the two-leg route
          costs about 45% more than the isotherm.
      - text: Q is the same on both paths, because the temperature change is the same.
        correct: false
        feedback: >-
          The temperature change is indeed the same — it is a state function. But heat is not
          determined by ΔT alone; it also depends on how much work was done along the way.
      - text: Both W_on and Q are the same, since the gas cannot tell which route it took.
        correct: false
        feedback: >-
          The gas indeed cannot tell — which is precisely why its *state* functions are
          identical. The path functions describe what happened at the boundary, and the
          boundary very much can tell.

  - id: Q-05-3
    type: multiple-choice
    objectives: [OBJ-05-3]
    prompt: >-
      Using dU = δQ + δW_on, a gas expands isothermally and reversibly. What are the signs of
      W_on, Q and ΔU?
    choices:
      - text: "W_on < 0, Q > 0, ΔU = 0."
        correct: true
        feedback: >-
          Right. The gas pushes its piston out, so work done on it is negative; its
          temperature and hence its internal energy are unchanged; so heat must flow in to
          supply exactly the energy the gas spent on its surroundings.
      - text: "W_on > 0, Q < 0, ΔU = 0."
        correct: false
        feedback: >-
          The signs are inverted. In our convention W_on is positive when work is done ON the
          gas, i.e. during compression. This is expansion.
      - text: "W_on < 0, Q = 0, ΔU < 0."
        correct: false
        feedback: >-
          That describes an adiabatic expansion, where no heat flows and the gas cools. Here
          the temperature is held fixed, which requires heat to flow in.
      - text: "W_on < 0, Q > 0, ΔU > 0."
        correct: false
        feedback: >-
          For an ideal gas U depends only on temperature, and the temperature is constant, so
          ΔU must be exactly zero.

  - id: Q-05-4
    type: multiple-choice
    objectives: [OBJ-05-4]
    misconception: dq-dw-exact
    prompt: >-
      Why is heat written δQ rather than dQ?
    choices:
      - text: Because there is no function Q of the state whose difference gives the heat transferred.
        correct: true
        feedback: >-
          Correct, and the cross-derivative test makes it concrete: for an ideal gas
          ∂M/∂V ≠ ∂N/∂T for δQ, so no such function exists. Dividing by T repairs the failure
          and produces the entropy — which is why δQ/T earns a proper d.
      - text: Because δ denotes a small quantity while d denotes an infinitesimal one.
        correct: false
        feedback: >-
          Both symbols denote infinitesimals. The distinction is not about size but about
          whether the infinitesimal is the differential of some state function.
      - text: Because heat is not conserved, unlike energy.
        correct: false
        feedback: >-
          Non-conservation is not the issue: work is not conserved either, and volume is
          conserved but perfectly exact. What matters is whether a state function exists.
      - text: Because heat can be negative, and d is reserved for positive quantities.
        correct: false
        feedback: >-
          Exact differentials are routinely negative — dU is negative whenever a system loses
          energy. Sign has nothing to do with exactness.

  - id: Q-05-5
    type: multiple-choice
    objectives: [OBJ-05-5]
    misconception: reversible-just-backward
    prompt: >-
      A piston is slammed down suddenly, compressing a gas. Is the work done on the gas equal
      to the area under a curve in the P-V plane?
    choices:
      - text: No — during the process the gas has no single pressure, so there is no curve to draw.
        correct: true
        feedback: >-
          Right. The work is -∫P_ext dV, using the pressure applied at the boundary. Only when
          the process is quasistatic does P_ext equal the gas's own P, and only then is the
          area under the P-V curve the work.
      - text: Yes — the work is always the area under the curve, since that is the definition.
        correct: false
        feedback: >-
          The definition is δW_on = -P_ext dV at the boundary. Writing the gas's own P there
          smuggles in the assumption that the gas is in equilibrium throughout, which a
          slammed piston violates.
      - text: Yes, provided the initial and final states are equilibrium states.
        correct: false
        feedback: >-
          Well-defined endpoints are not enough. The integral needs a well-defined pressure at
          every point *along* the way, not just at the ends.
      - text: No — because work is only defined for reversible processes.
        correct: false
        feedback: >-
          Work is perfectly well defined for irreversible processes; it is simply not given by
          the area under a P-V curve for the gas. Engines would be unanalysable otherwise.

  - id: Q-05-6
    type: numeric
    objectives: [OBJ-05-2]
    prompt: >-
      One mole of ideal gas at 300 K expands isothermally and reversibly from 10.0 L to
      20.0 L. Compute the work done ON the gas, in joules. Use R = 8.314 J/(mol K).
    answer: -1729.0
    tolerance: 15.0
    feedback: >-
      W_on = -nRT ln(V2/V1) = -(1)(8.314)(300) ln 2 = -1729 J. The sign is negative because
      the gas does work on its surroundings. If you obtained +1729 you are using the other
      sign convention — which is fine elsewhere, but not in this course.

  - id: Q-05-7
    type: multiple-choice
    objectives: [OBJ-05-1, OBJ-05-3]
    prompt: >-
      A gas is taken around a closed cycle and returns to its exact starting state. Which is
      true of one complete cycle?
    choices:
      - text: ΔU = 0, and the net work on the gas equals minus the net heat absorbed.
        correct: true
        feedback: >-
          Correct — and this is what makes engines possible. The state function returns to its
          value, so the two path functions must cancel each other rather than vanish
          individually.
      - text: All of ΔU, Q and W_on are zero, since nothing has changed.
        correct: false
        feedback: >-
          Only the state function must return to its value. If Q and W_on both vanished around
          every loop, no engine could ever produce net work, and yet they plainly do.
      - text: ΔU = 0 and W_on = 0, so Q = 0 as well.
        correct: false
        feedback: >-
          The net work around a loop is minus the enclosed area, which is zero only for a
          degenerate loop with no area. A genuine cycle encloses area.
      - text: The net work equals the area under the upper curve of the cycle.
        correct: false
        feedback: >-
          It equals the *enclosed* area — the area under the upper branch minus the area under
          the lower one, since the return leg contributes with the opposite sign.

  - id: Q-05-10
    type: multiple-choice
    objectives: [OBJ-05-3, OBJ-05-5]
    misconception: adiabatic-constant-t
    prompt: >-
      A gas expands adiabatically and quasistatically. What happens to its temperature?
    choices:
      - text: It falls, because the gas does work on its surroundings with no heat flowing in to replace the energy.
        correct: true
        feedback: >-
          Correct. Adiabatic means Q = 0, so the first law gives ΔU = W_on < 0 for an
          expansion. The gas pays for the work out of its own internal energy, and for an
          ideal gas that energy is the temperature.
      - text: It stays constant, because "adiabatic" means no temperature change.
        correct: false
        feedback: >-
          This confuses adiabatic with isothermal. Adiabatic constrains the *heat* (Q = 0);
          isothermal constrains the *temperature*. They are different constraints, and for an
          expanding gas they give opposite answers — which is exactly why the two curves in the
          P-V plane have different slopes.
      - text: It rises, because compression of the surroundings heats the gas.
        correct: false
        feedback: >-
          The gas is expanding, not being compressed. An adiabatic *compression* does raise the
          temperature, and that is how a diesel engine ignites its fuel.
      - text: It stays constant, because no heat enters or leaves.
        correct: false
        feedback: >-
          No heat crossing the boundary does not mean no energy crossing it. Work is the other
          channel, and along an adiabat it is the only one.

  - id: Q-05-8
    type: prediction
    objectives: [OBJ-05-2]
    prompt: >-
      Before calculating: a gas expands from V to 2V, once at constant pressure and once at
      constant temperature, both starting from the same state. Predict which route does more
      work on the surroundings, and by roughly what factor.
    discussion: >-
      The isobaric route does more: |W| = P₁V for constant pressure against N k_B T ln 2 ≈
      0.69 P₁V for the isotherm, so about 45% more. The reason is visible without algebra —
      along the isotherm the pressure falls as the gas expands, so the gas is pushing against
      less and less, while the isobaric route keeps the pressure at its initial value the whole
      way. Anyone who predicted the isotherm was probably picturing the isotherm's larger
      *temperature*-related heat flow rather than the area under the curve.

  - id: Q-05-9
    type: short-answer
    objectives: [OBJ-05-4, OBJ-05-5]
    prompt: >-
      In a few sentences, explain to a classmate why "reversible" means more than "can be run
      backwards", using a concrete example where a process can be undone for the system but
      not for the universe.
    discussion: >-
      A strong answer distinguishes restoring the system from restoring system and
      surroundings together. Free expansion is the standard example: a gas that has expanded
      into a vacuum can certainly be pushed back into its original volume, but doing so
      requires work from outside and dumps heat into the surroundings, which are then
      permanently changed. A reversible process leaves no such trace anywhere. Answers that
      stop at "you can run the film backwards" have described time-reversal of the mechanics,
      which is true of the free expansion too and therefore cannot be the distinguishing
      feature.
