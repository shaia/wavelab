module: 03-fourier-series
questions:
  - id: Q-03-1
    type: multiple-choice
    objectives: [OBJ-03-2]
    prompt: >-
      אות מחזורי מקיים f(t + T/2) = -f(t): המחצית השנייה של כל מחזור היא הראשונה הפוכה. אילו
      הרמוניות הוא יכול להכיל, וכיצד אתם יודעים זאת לפני חישוב של אינטגרל כלשהו?
    choices:
      - text: הרמוניות אי-זוגיות בלבד — כל מקדם זוגי מתאפס, כולל הממוצע.
        correct: true
        feedback: >-
          נכון, וזה עולה הצבה אחת. הזזת אינטגרל המקדם ב-T/2 מכפילה את האיבר ה-n ב-(-1)^n, ולכן
          הסימטריה כופה c_n = -(-1)^n c_n. עבור n זוגי זה נקרא c_n = -c_n, ורק אפס שווה למינוס
          עצמו. הגל הריבועי וגל המשולש שניהם מסוג זה, ולכן לאף אחד מהם אין הרמוניה שנייה.
      - text: הרמוניות זוגיות בלבד, משום שהגל חוזר על עצמו פעמיים בתוך כל מחזור.
        correct: false
        feedback: >-
          זה מתאר את התנאי ההפוך, f(t + T/2) = +f(t), שהוא באמת אות בעל זמן מחזור T/2 בתחפושת
          ושבאמת יש לו רק הרמוניות זוגיות של תדר היסוד המקורי. סימן המינוס כאן הופך במקום לחזור,
          והוא מוחק בדיוק את ההרמוניות שתשובתכם משאירה.
      - text: כל ההרמוניות — סימטריה יכולה להזיז מופעים של איברים אך לא להסיר אף אחד מהם.
        correct: false
        feedback: >-
          זוגיות ואי-זוגיות אכן רק מזיזות מופעים: הן הופכות את המקדמים לממשיים טהורים או למדומים
          טהורים בלי למחוק אף אחד. סימטריית חצי-מחזור חזקה יותר, משום שהיא קושרת את האות להעתק
          מוזז של עצמו ולא להשתקפות שלו, והקשר הזה הוא מה שכופה מחצית מהמקדמים להתאפס.
      - text: אי אפשר לומר דבר בלי לחשב את האינטגרלים עבור הגל הספציפי.
        correct: false
        feedback: >-
          אפשר, ובזול. ההצבה t -> t + T/2 בתוך אינטגרל המקדם עולה שתי שורות ומכריעה את כל
          ההרמוניות הזוגיות בבת אחת, לכל גל בעל הסימטריה הזו, תהא צורתו אשר תהא. טיעוני סימטריה
          עונים על השאלה שהאינטגרלים היו עונים עליה בסופו של דבר, לפני שעושים אותם.
  - id: Q-03-2
    type: multiple-choice
    objectives: [OBJ-03-3]
    misconception: more-terms-always-converge
    prompt: >-
      הסכום החלקי של טור פורייה של גל ריבועי גולש בכ-9 אחוזים ממש לפני הקפיצה. מה קורה לגלישה
      הזו ככל שמוסיפים איברים?
    choices:
      - text: היא מצטמצמת ברוחבה ומחליקה אל הקפיצה, אך גובהה נשאר סביב 8.9 אחוזים מהקפיצה לנצח.
        correct: true
        feedback: >-
          נכון. במדידה, הגלישה היא 9.21 אחוזים ב-7 הרמוניות, 8.97 אחוזים ב-31, ו-8.9491 אחוזים
          ב-511 — מתייצבת על קבוע במקום לשאוף לאפס. מה שכן משתפר הוא *אנרגיית* השגיאה, היורדת
          כ-N^(-1/2). התכנסות באנרגיה והתכנסות בנקודה הגרועה ביותר הן הבטחות שונות, ורק הראשונה
          מקוימת כאן.
      - text: היא מצטמצמת בהתמדה ונעלמת בגבול — איברים נוספים משפרים את הקירוב בכל מקום.
        correct: false
        feedback: >-
          זו הציפייה הטבעית והיא שגויה, ולכן לגלישה יש שם. הטור אכן מתכנס בכל נקודה הרחוקה
          מהקפיצה, ומתכנס לנקודת האמצע בקפיצה עצמה, ולכן דבר אינו שבור. אבל השגיאה *הגדולה
          ביותר* בסביבת הקפיצה אינה מתכווצת. מגבר ברוחב פס סופי המשחזר גל ריבועי גולש בדיוק
          מהסיבה הזו, ורוחב פס נוסף רק מקצר את הגלישה, לעולם אינו מקטין אותה.
      - text: היא גדלה ללא גבול, משום שכל הרמוניה חדשה מוסיפה עוד אדווה.
        correct: false
        feedback: >-
          האדוות אכן מתרבות, אך הן גם מצטמצמות ברוחבן וסכום תרומותיהן חסום. הגלישה מתקרבת לקבוע
          מוגדר מלמעלה, וכבר מההרמוניות הבודדות הראשונות היא בתוך חצי אחוז מערכה הסופי.
      - text: זהו ארטיפקט של שרטוט על רשת סופית והוא נעלם ברזולוציה מספקת.
        correct: false
        feedback: >-
          עידון הרשת הופך את המדידה למדויקת *יותר* והגלישה מתכנסת ל-8.9491 אחוזים ולא מתרחקת
          ממנו. הטעות ההפוכה היא המלכודת האמיתית: מכיוון שהגלישה נעה אל הקפיצה ככל שמוסיפים
          איברים, חלון מדידה קבוע מפספס אותה בסופו של דבר ומדווח מספר נוח, מתכווץ ושגוי.
  - id: Q-03-3
    type: numeric
    objectives: [OBJ-03-3]
    prompt: >-
      גל מחזורי רציף בכל מקום, אך השיפוע שלו קופץ — יש לו פינות, כמו לגל משולש. מקדמיו דועכים
      כ-1/n^p עבור n גדול. מהו p?
    answer: 2.0
    tolerance: 0.1
    feedback: >-
      p = 2. אינטגרציה בחלקים על נוסחת המקדם מחליפה חזקה של 1/n בנגזרת, ואיברי השפה מתבטלים מכוח
      המחזוריות כל עוד הפונקציה הנגזרת רציפה. אות שקופץ נותן p = 1; אות רציף בעל שיפוע קופץ נותן
      p = 2 (המשולש); באופן כללי הנגזרת הראשונה שאינה רציפה קובעת את הקצב. גלים חלקים יותר זולים
      יותר לייצוג, וזהו כל תוכנה של טבלת הדעיכה.
  - id: Q-03-4
    type: numeric
    objectives: [OBJ-03-4]
    prompt: >-
      גל ריבועי במשרעת שיא 1 ובקצב חזרה f0 מניע מהוד בעל Q גבוה המכוון בדיוק ל-3 f0. אחר כך אותו
      מהוד מונע בגל סינוס טהור במשרעת שיא 1 בתדר שלו עצמו, 3 f0. בכמה קטנה המשרעת במצב מתמיד
      במקרה הראשון לעומת השני? תנו את היחס (מקרה ראשון) / (מקרה שני).
    answer: 0.424
    tolerance: 0.02
    feedback: >-
      המהוד מגיב רק למה שההנעה נושאת בתדר שלו עצמו. גל ריבועי יחידתי נושא 4/(3 pi) = 0.4244
      בהרמוניה השלישית שלו, מול 1.0 שהסינוס הטהור מספק, ומכיוון ששתי ההנעות יושבות על תהודה
      עקומת התגובה מכפילה את שתיהן באותו הגבר. לכן היחס הוא בדיוק משרעת ההרמוניה, 0.42. אילו היה
      מכוון ל-2 f0 לא הייתה כלל תגובת תהודה, משום שסימטריית חצי-מחזור מוחקת כל הרמוניה זוגית
      וההנעה אינה נושאת שם דבר — ומה שמהוד כזה בכל זאת עושה הוא הזנב מחוץ לתהודה של שכניו, כעשירית
      ממה שהוא משיג ב-3 f0.
  - id: Q-03-5
    type: multiple-choice
    objectives: [OBJ-03-5]
    prompt: >-
      נמדדו ארבעה ספקטרומים. (i) כל ההרמוניות קיימות, משרעות דועכות כ-1/n. (ii) הרמוניות
      אי-זוגיות בלבד, דועכות כ-1/n. (iii) הרמוניות אי-זוגיות בלבד, דועכות כ-1/n^2. (iv) כל
      ההרמוניות קיימות, כמעט שוות בגודלן עד n גבוה מאוד. איזה מהם שייך לגל המסור?
    choices:
      - text: (i) — קפיצה כופה את הדעיכה האיטית 1/n, והיעדר סימטריית חצי-מחזור משאיר את ההרמוניות הזוגיות.
        correct: true
        feedback: >-
          נכון, וצמד הרמזים הוא מה שמכריע. הדעיכה 1/n אומרת שיש קפיצה איפשהו במחזור; נוכחות
          ההרמוניות הזוגיות אומרת שהמחצית השנייה של המחזור אינה הראשונה הפוכה. רק גל המסור מקיים
          את שניהם. לפרוטוקול: (ii) הוא הגל הריבועי, (iii) המשולש, ו-(iv) רכבת פולסים צרה,
          שמעטפת ה-sinc שלה עדיין רחבה בהרמוניות האלה.
      - text: (ii) — גל הקפיצה הקלאסי, ולכן הרמוניות אי-זוגיות הדועכות כ-1/n.
        correct: false
        feedback: >-
          הדעיכה 1/n נכונה, ומהסיבה הנכונה, אבל לגל המסור אין סימטריית חצי-מחזור: הזזתו בחצי
          מחזור אינה נותנת את מינוס עצמו, אלא רמפה בהיסט אחר. לכן ההרמוניות הזוגיות שלו שורדות.
          ספקטרום (ii) שייך לגל הריבועי.
      - text: (iii) — הרמפה רציפה בתוך המחזור, ולכן מקדמיה דועכים כ-1/n^2.
        correct: false
        feedback: >-
          הרמפה רציפה *בתוך* מחזור אבל הגל מחזורי, ובסוף כל מחזור הוא צונח באי-רציפות חזרה לערך
          ההתחלתי. הקפיצה הזו היא מה שהמקדמים רואים, והיא קובעת את הדעיכה על 1/n. ספקטרום (iii),
          עם דעיכת 1/n^2 והרמוניות אי-זוגיות בלבד, הוא גל המשולש.
      - text: (iv) — כל ההרמוניות קיימות בעוצמה דומה, שכן הרמפה מבקרת בכל ערך במידה שווה.
        correct: false
        feedback: >-
          ביקור בכל ערך אינו קשור כלל לתוכן ההרמוני; מה שקובע הוא חדות התכונות. ספקטרום שטוח כל
          כך שייך למשהו חד בהרבה מרמפה — רכבת פולסים צרה, שמעטפת ה-sinc שלה עדיין לא התהפכה
          בהרמוניות האלה. משרעות גל המסור יורדות בהתמדה כ-1/n.
  - id: Q-03-6
    type: short-answer
    objectives: [OBJ-03-1]
    prompt: >-
      מדידה של אות מחזורי מחזירה מקדם שלישי בעל גודל |c_3| = 0.25 וארגומנט arg(c_3) = -pi/2.
      נסחו מה כל אחד משני המספרים האלה טוען פיזיקלית, ותארו ניסוי שיאשר כל אחד מהם בנפרד.
    discussion: >-
      הגודל קובע את עוצמת ההרמוניה השלישית: הפאזור שלה הוא 2 c_3* , ולכן האות מכיל סינוסואידה
      ב-3 omega0 במשרעת 2 |c_3| = 0.5. הארגומנט קובע את התזמון של אותה הרמוניה — היכן במחזור היא
      מגיעה לשיאה ביחס ל-t = 0 — ולא דבר מלבד זאת. כדי לאשר את הגודל, העמידו מסנן צר או מגבר
      נעילת מופע המכוון ל-3 omega0 מול האות ומדדו את המשרעת היוצאת: היא צריכה להיות 0.5, והיא שם
      בין אם מישהו בחר לפרק את האות ובין אם לא. כדי לאשר את הארגומנט דרוש עוגן מופע, משום
      שהארגומנט לבדו אינו אינווריאנט: הזיזו את ראשית הזמן ב-delta וכל arg(c_n) יזוז ב-n omega0
      delta בעוד כל |c_n| יישאר ללא שינוי. לכן האמירה הניתנת למדידה היא *הפרש* מופע — בין ההרמוניה
      הזו לתדר היסוד, או בינה לבין הדק חיצוני — בדיוק כפי שמודול 00 טען עבור תנודה בודדת. ההבחנה
      הזו בין מה שנושאים הגדלים לבין מה שנושאים המופעים היא הזרע של השאלה שמודול 04 שואל על האם
      ספקטרום זוכר מתי דברים קרו.
