module: 02-damped-driven
questions:
  - id: Q-02-1
    type: multiple-choice
    objectives: [OBJ-02-1]
    prompt: >-
      מסה של 2.0 ק"ג יושבת על קפיץ בעל קבוע 8.0 ניוטון למטר עם מקדם ריסון של 10.0 ק"ג
      לשנייה. באיזה משטר מדובר, וכיצד נראית התנועה לאחר שהמסה מוזזת ומשוחררת?
    choices:
      - text: ריסון-יתר — היא זוחלת בחזרה לשיווי משקל ללא תנודה, וחוצה את האפס לכל היותר פעם אחת.
        correct: true
        feedback: >-
          נכון. הריסון הקריטי הוא b = 2 sqrt(mk) = 2 sqrt(16) = 8.0 ק"ג לשנייה, ו-10.0 מעליו,
          ולכן gamma = 5.0 גדול מ-2 omega0 = 4.0. שני השורשים ממשיים ושליליים: שני מעריכים
          דועכים, ללא צלצול. שימו לב שהגדלת b נוספת עושה את החזרה איטית יותר, לא מהירה יותר.
      - text: תת-ריסון — היא מצלצלת בתדירות מעט מתחת ל-sqrt(k/m) בתוך מעטפת דועכת.
        correct: false
        feedback: >-
          בדקו את הגבול לפני שאתם בוחרים משטר: צלצול מחייב b < 2 sqrt(mk) = 8.0 ק"ג לשנייה,
          ולמערכת הזו יש 10.0. השוואת b ל-sqrt(mk) = 4.0 במקום ל-2 sqrt(mk) היא הדרך הרגילה
          להגיע לכאן.
      - text: ריסון קריטי — b גדול מספיק כך שהתנועה בקושי אינה מתנודדת.
        correct: false
        feedback: >-
          ריסון קריטי הוא ערך מדויק אחד, b = 2 sqrt(mk) = 8.0 ק"ג לשנייה, ולא תחום מעל איזשהו
          סף. ב-10.0 המערכת עברה אותו ונמצאת בריסון-יתר של ממש, שחוזר לשיווי משקל לאט יותר
          מהמקרה הקריטי, לא מהר יותר.
      - text: זה תלוי במשרעת השחרור — ריסון כבד משנה רק בהזזות גדולות.
        correct: false
        feedback: >-
          המשוואה ליניארית, ולכן כל משרעת מותחת את אותו פתרון עצמו: המשטר נקבע על ידי m, k ו-b
          בלבד. אי-התלות במשרעת שרדה ממודול 01 ללא פגע; מה שהמודול הזה הופך למכריע הוא *התזמון*
          של ההנעה, לא גודל התנועה.

  - id: Q-02-2
    type: multiple-choice
    objectives: [OBJ-02-2, OBJ-02-3]
    prompt: >-
      אתם מניעים מתנד ביד. השוו את ההזזה לכוח המניע בשלוש תדירויות: הרבה מתחת ל-omega0,
      בדיוק ב-omega0, והרבה מעליו. מהו פיגור המופע בכל אחד מהמקרים?
    choices:
      - text: 0, אחר כך pi/2, אחר כך pi — בקנה אחד, אחר כך רבע מחזור מאחור, אחר כך מנוגד.
        correct: true
        feedback: >-
          נכון, ולכל גבול יש בעלים פיזיקלי. לאט, הקפיץ שולט והמסה יושבת היכן שהכוח מעמיד אותה.
          ב-omega0 החלק הממשי של המכנה מתאפס ורק איבר הריסון שורד, ומכאן בדיוק pi/2 יהא הריסון
          אשר יהא. מהר, ההתמדה שולטת והמסה נעה כנגד היד.
      - text: 0 לכל אורך הדרך — המסה תמיד עוקבת אחר הכוח, ורק המשרעת משתנה.
        correct: false
        feedback: >-
          אז ההנעה לעולם לא הייתה יכולה לבצע עבודה נטו לאורך מחזור במצב המתמיד, ולא היה במה
          לשלם לריסון. הפיגור אינו פרט שולי: הוא מה שמאפשר לאנרגיה לזרום פנימה, והשפעתו גדולה
          ביותר בתהודה, שם הכוח בקנה אחד עם ה*מהירות*.
      - text: pi/2 לכל אורך הדרך — התגובה תמיד מפגרת ברבע מחזור.
        correct: false
        feedback: >-
          רבע מחזור הוא הערך ב-omega0 בדיוק, והוא מדויק שם עבור כל ריסון — וזה מה שהופך אותו
          לדרך טובה *למצוא* את omega0. הרחק מהתהודה הפיגור נע בין 0 ל-pi, וכמה מהר הוא מסתובב
          הוא דרך שלישית למדוד את Q.
      - text: pi, אחר כך pi/2, אחר כך 0 — הפיגור קטן ככל שההנעה מהירה יותר.
        correct: false
        feedback: >-
          זו הסדרה הפוכה. בחנו אותה מול הגבול האיטי: דחפו מסה בהדרגה רבה והיא תלך לאן שאתם
          דוחפים, כלומר פיגור אפס ולא חצי מחזור. הפיגור גדל עם התדירות משום שההתמדה מנצחת
          בהדרגה את הוויכוח.

  - id: Q-02-3
    type: multiple-choice
    objectives: [OBJ-02-3]
    misconception: resonance-peak-at-omega0
    prompt: >-
      מתנד מרוסן מונע בטווח של תדירויות ומשרעת המצב המתמיד שלו נרשמת. באיזו תדירות המשרעת
      גדולה ביותר?
    choices:
      - text: מעט מתחת ל-omega0, ב-omega0 sqrt(1 - 1/(2 Q^2)) — ועבור Q מתחת ל-1/sqrt(2) אין שיא כלל.
        correct: true
        feedback: >-
          נכון. מקסום |X| פירושו מזעור (omega0^2 - omega^2)^2 + gamma^2 omega^2, ומכאן
          omega^2 = omega0^2 - gamma^2/2. ההיסט הוא 0.06% ב-Q = 20 — בלתי נראה, ולכן התשובה
          השגויה שורדת — ו-6.5% ב-Q = 2. מתחת ל-Q = 1/sqrt(2) אין לשורש ערך ממשי והתגובה פשוט
          יורדת מ-F0/k.
      - text: בדיוק ב-omega0 = sqrt(k/m), ללא תלות בריסון.
        correct: false
        feedback: >-
          בדיוק ב-omega0 נמצא המקום שבו *פיגור המופע* הוא pi/2 ושבו ה*הספק* הנבלע מגיע לשיא —
          שניהם מדויקים עבור כל ריסון. משרעת ההזזה היא זו שנעה, משום שהמכנה שלה נושא את גורם
          omega הנוסף שביטוי ההספק מבטל.
      - text: מעט מעל omega0, כי צריך להתגבר על הריסון לפני שהמסה מגיבה.
        correct: false
        feedback: >-
          הריסון מזיז את השיא כלפי מטה, לא כלפי מעלה: הוא נכנס למכנה כ--gamma^2/2 תחת השורש.
          התדירות שאכן יושבת מעל omega0 היא שיא ה*תאוצה*, ב-omega0 / sqrt(1 - 1/(2 Q^2)) —
          תמונת הראי של זו.
      - text: בתדירות הדעיכה החופשית omega_d = sqrt(omega0^2 - gamma^2/4).
        correct: false
        feedback: >-
          ניחוש סביר, ושגוי בפי שניים בתיקון: תדירות הצלצול של דעיכה *חופשית* היא omega_d, אך
          משרעת המתנד המונע מגיעה לשיא ב-sqrt(omega0^2 - gamma^2/2), שנמוכה עוד יותר. שלוש
          תדירויות סמוכות — omega0, omega_d, omega_peak — שמתלכדות רק כאשר הריסון מתאפס.

  - id: Q-02-4
    type: multiple-choice
    objectives: [OBJ-02-5]
    misconception: resonance-grows-forever
    prompt: >-
      בהתחלה ממנוחה, אתם מניעים מתנד מרוסן בדיוק בתדירות העצמית שלו ולעולם לא מפסיקים. מה
      קורה למשרעת?
    choices:
      - text: היא מטפסת לעבר Q כפול התגובה הסטטית F0/k ומתייצבת שם, תוך כדי בערך Q/pi מחזורים.
        correct: true
        feedback: >-
          נכון. המעטפת גדלה כ-Q (F0/k) (1 - e^(-gamma t / 2)): תהודה היא הגברה פי Q, לא
          התבדרות. זמן הבנייה 2/gamma הוא אותו 2/gamma שקובע כמה זמן מצלצל מתנד שהוכה, ולכן
          מערכת בעלת Q גבוה היא רועשת ובררנית *וגם* איטית.
      - text: היא גדלה ללא גבול — זה בדיוק מה שתהודה אומרת.
        correct: false
        feedback: >-
          זה נכון רק עבור המתנד האידיאלי חסר הריסון, שאין לו מצב מתמיד כלל. עם ריסון כלשהו,
          האנרגיה האובדת למחזור גדלה כמשרעת בריבוע בעוד האנרגיה המסופקת גדלה ליניארית בלבד,
          ולכן השתיים חייבות להתאזן — וכך קורה, ב-Q F0/k.
      - text: היא גדלה זמן מה ואז קורסת, כי המתנד יוצא מקנה אחד עם ההנעה.
        correct: false
        feedback: >-
          שום דבר אינו מוציא אותו מקנה אחד: פתרון המצב המתמיד חוזר על עצמו בתדירות ההנעה לנצח,
          נעול בפיגור של רבע מחזור. פעימות וקריסה מתרחשות כאשר ההנעה *מוסטת* מ-omega0, לא כאשר
          היא יושבת עליו.
      - text: היא מגיעה ל-F0/k, אותה משרעת שכוח המופעל לאט היה מייצר.
        correct: false
        feedback: >-
          F0/k היא התשובה הרבה *מתחת* לתהודה, שם הקפיץ לבדו מתנגד לכוח. ב-omega0 איברי הקפיץ
          וההתמדה מתבטלים בדיוק ורק איבר הריסון שורד במכנה, ונשאר פי Q מזה.

  - id: Q-02-5
    type: numeric
    objectives: [OBJ-02-4, OBJ-02-6]
    prompt: >-
      מדידה סרוקה של מהוד נותנת שיא תגובת הספק ב-2400 הרץ עם רוחב מלא בחצי ההספק של 30 הרץ.
      מהו מקדם הטיב Q שלו?
    answer: 80.0
    tolerance: 2.0
    feedback: >-
      Q = f0 / Delta f = 2400 / 30 = 80. היחס זהה בין אם הוא נלקח בהרץ ובין אם ברדיאנים
      לשנייה, משום ש-Q חסר ממד — וזה בדיוק מה שמאפשר למספר אחד לתאר את המהוד ללא תלות ביחידות
      שעל הציר.

  - id: Q-02-6
    type: numeric
    objectives: [OBJ-02-1, OBJ-02-4]
    prompt: >-
      פעמון בעל Q = 30 מוכה פעם אחת. לאחר כמה תנודות מלאות בקירוב ירדה משרעתו ל-1/e מערכה
      ההתחלתי?
    answer: 9.55
    tolerance: 1.0
    feedback: >-
      המשרעת דועכת כ-e^(-gamma t / 2), ולכן היא מגיעה ל-1/e ב-t = 2/gamma = 2Q/omega0. מחולק
      בזמן המחזור 2 pi/omega0 זה Q/pi = 30/pi = 9.5 תנודות. שימו לב לפי שניים: ה*אנרגיה*
      יורדת ל-1/e בחצי מהזמן הזה, Q/(2 pi) מחזורים, וציטוט מספר אחד במקום השני הוא המעידה
      הנפוצה ביותר כאן.

  - id: Q-02-7
    type: short-answer
    objectives: [OBJ-02-4, OBJ-02-6]
    prompt: >-
      נמסרו לכם שלוש מדידות של אותו מהוד בלתי מזוהה: רשומת דעיכה לאחר הכאה יחידה, עקומת משרעת
      סרוקה, ועקומת מופע סרוקה. תארו כיצד הייתם מחלצים את Q מכל אחת מהן, ואמרו מה היה המשמעות
      אילו שלוש התשובות היו נבדלות ב-30%.
    discussion: >-
      מרשומת הדעיכה: התאימו את הלוגריתם של המעטפת כדי לקבל את gamma, ספרו חציות אפס כדי לקבל
      את omega_d, ודווחו Q = omega0/gamma. מסריקת המשרעת: מצאו את השיא ואת שתי התדירויות שבהן
      המשרעת ירדה למקסימום חלקי שורש 2, ואז Q = omega_peak חלקי המרחק ביניהן. מסריקת המופע:
      אתרו היכן הפיגור חוצה את pi/2 ומדדו כמה מהר הוא מסתובב שם, שכן
      Q = (omega0/2) dphi/domega. השלוש שקולות עבור מהוד ליניארי עם ריסון צמיג, ולכן פער של
      30% הוא עדות נגד המודל ולא נגד הציוד — החשודים הסבירים הם קפיץ לא ליניארי במשרעת גדולה,
      חיכוך יבש במקום ריסון צמיג (הדעיכה שלו ליניארית בזמן, לא מעריכית), או תהודה שנייה סמוכה
      המזהמת את הסריקה. פער של אחוז אחד פירושו משהו אחר: זו השגיאה השיטתית שכל אומד נושא,
      והמעבדה של המודול מודדת את שלושתן.
