module: 04-pressure
questions:
  - id: Q-04-1
    type: multiple-choice
    objectives: [OBJ-04-1]
    misconception: equilibrium-motion-stops
    prompt: >-
      גז נמצא בשיווי משקל במיכל אטום, ומד הלחץ שלו יציב לחלוטין. מה עושות המולקולות?
    choices:
      - text: נעות מהר כתמיד ומתנגשות ללא הרף; רק הממוצעים התייצבו.
        correct: true
        feedback: >-
          נכון. שיווי משקל הוא טענה על ממוצעים מאקרוסקופיים, לא על התנועה המיקרוסקופית.
          בטמפרטורה של 300 קלווין מולקולות חנקן נעות בממוצע בכ-500 מטר לשנייה, בין אם המד זז
          ובין אם לא.
      - text: הן נעצרו, ולכן הלחץ אינו משתנה עוד.
        correct: false
        feedback: >-
          מצב כזה מחייב אנרגיה קינטית אפסית, כלומר אפס מוחלט. הוא גם אינו עקבי עם עצמו:
          מולקולות חסרות תנועה אינן מפעילות לחץ כלל, ולכן המד היה מראה אפס ולא ערך יציב.
      - text: הן נעות אך אינן פוגעות עוד בדפנות, ולכן לא מועבר עוד תנע.
        correct: false
        feedback: >-
          התנגשויות עם הדפנות הן בדיוק מה שהלחץ הוא. הן נמשכות בקצב עצום; מה שיציב הוא הקצב,
          לא היעדרו.
      - text: הן מתנדנדות במקומן סביב מיקומים קבועים, כמו במוצק.
        correct: false
        feedback: >-
          זה תיאור של מוצק, שבו האטומים כבולים לאתרי סריג. בגז המולקולות נעות חופשית בין
          התנגשויות וסורקות את כל המיכל.

  - id: Q-04-2
    type: multiple-choice
    objectives: [OBJ-04-2, OBJ-04-3]
    misconception: temperature-total-energy
    prompt: >-
      מיכל א' מכיל מול אחד של הליום בטמפרטורה של 300 קלווין. מיכל ב' מכיל שני מולים של הליום
      בטמפרטורה של 300 קלווין, בנפח כפול. איזו טענה נכונה?
    choices:
      - text: לשניהם אותו לחץ ואותה אנרגיה ממוצעת לאטום; למיכל ב' יש אנרגיה פנימית כפולה.
        correct: true
        feedback: >-
          נכון, וזו ההבחנה שכדאי לשאת הלאה: טמפרטורה מודדת אנרגיה *לחלקיק*, ואנרגיה פנימית
          מודדת את ה*סך הכול*. הכפלת מספר החלקיקים והנפח יחד אינה משנה את היחס ולכן אינה משנה
          את הלחץ.
      - text: למיכל ב' לחץ כפול, משום שיש בו פי שניים אטומים.
        correct: false
        feedback: >-
          מספר החלקיקים לבדו אינו קובע את הלחץ — הצפיפות קובעת. במיכל ב' יש פי שניים חלקיקים
          בנפח כפול, ולכן הצפיפות המספרית, ואיתה הלחץ, אינה משתנה.
      - text: למיכל ב' טמפרטורה כפולה, משום שיש בו אנרגיה פנימית כפולה.
        correct: false
        feedback: >-
          זהו הבלבול הנפוץ ביותר בכל הנושא. טמפרטורה עוקבת אחר האנרגיה הממוצעת לחלקיק; פיזור
          אנרגיה כפולה על פני פי שניים חלקיקים משאיר את הממוצע, ולכן גם את הטמפרטורה, בדיוק
          במקומו.
      - text: למיכל א' לחץ גבוה יותר, משום שהאטומים בו צפופים יותר.
        correct: false
        feedback: >-
          האטומים אינם צפופים יותר: לשני המיכלים אותה צפיפות מספרית, וזו משמעות "צפוף" כאן.

  - id: Q-04-3
    type: multiple-choice
    objectives: [OBJ-04-2]
    prompt: >-
      אתם מכפילים את מסת כל חלקיק בעוד הטמפרטורה והצפיפות נשמרות קבועות. מה קורה ללחץ?
    choices:
      - text: הוא אינו משתנה, משום שהחלקיקים הכבדים נעים לאט יותר בדיוק בגורם המקזז.
        correct: true
        feedback: >-
          בדיוק. מתקיים P = N m <v_x^2> / V, ומשפט חלוקת האנרגיה השווה קובע m<v_x^2> = k_B T,
          ולכן המסה מצטמצמת. חלקיקים כבדים פוגעים חזק יותר אך לעיתים רחוקות יותר, ושני
          האפקטים מתקזזים בזהות ולא בקירוב.
      - text: הוא מוכפל, משום שכל התנגשות מעבירה תנע כפול.
        correct: false
        feedback: >-
          כל התנגשות אכן מעבירה יותר תנע — אך בטמפרטורה קבועה החלקיקים הכבדים איטיים יותר,
          שכן <v_x^2> = k_B T / m, ולכן הם מגיעים לדופן לעיתים רחוקות יותר ובמהירות נמוכה
          יותר. עברו על P = N m <v_x^2>/V וצפו במסה מצטמצמת.
      - text: הוא נחצה, משום שהחלקיקים הכבדים נעים לאט יותר.
        correct: false
        feedback: >-
          שמרתם על ההאטה אך ויתרתם על המכה הכבדה יותר. שני האפקטים קיימים והם מתקזזים.
      - text: הוא אינו משתנה, משום שהלחץ לעולם אינו תלוי בחומר שממנו עשוי הגז.
        correct: false
        feedback: >-
          המסקנה נכונה אך הנימוק אינו. הלחץ בלתי תלוי במסה רק עבור גז *אידיאלי*; גזים אמיתיים
          בצפיפות גבוהה נבדלים זה מזה משום שלחלקיקיהם גדלים ומשיכות שונים.

  - id: Q-04-4
    type: numeric
    objectives: [OBJ-04-4]
    prompt: >-
      קופסה מכילה 10,000 חלקיקים ללא אינטראקציה בשיווי משקל תרמי. העריכו את סטיית התקן היחסית
      של הלחץ, כלומר sigma_P חלקי <P>, בעזרת החוק N^(-1/2). תנו את התשובה כשבר עשרוני.
    answer: 0.01
    tolerance: 0.002
    feedback: >-
      sigma_P/<P> = N^(-1/2) = 1/100 = 0.01, כלומר אחוז אחד. שימו לב במהירות שהגודל הזה הופך
      לבלתי מדיד: עבור מול אחד מתקבל כ-4e-13.

  - id: Q-04-5
    type: multiple-choice
    objectives: [OBJ-04-1, OBJ-04-4]
    misconception: heat-temperature-same
    prompt: >-
      איזה שינוי בודד יהפוך את פלוקטואציות הלחץ של גז לקלות ביותר לגילוי?
    choices:
      - text: מדידת מדגם קטן מאוד, כך ש-N קטן.
        correct: true
        feedback: >-
          כן. הפלוקטואציה היחסית תלויה ב-N וכמעט בלא כלום מלבדו — לא בטמפרטורה, לא בסוג הגז,
          ולא בלחץ עצמו. N קטן הוא הידית היחידה.
      - text: העלאת הטמפרטורה, כדי שההתנגשויות יהיו אלימות יותר.
        correct: false
        feedback: >-
          התנגשויות חמות יותר אכן אלימות יותר, אך יש בהתאם יותר מהן וגם הלחץ הממוצע עולה.
          הפלוקטואציה ה*יחסית* היא N^(-1/2), ללא תלות בטמפרטורה.
      - text: שימוש במולקולות כבדות יותר, כדי שכל פגיעה תהיה גדולה יותר.
        correct: false
        feedback: >-
          המסה מצטמצמת מן הלחץ בטמפרטורה קבועה, והיא מצטמצמת גם מן הפלוקטואציה היחסית.
      - text: דחיסת הגז, כדי שההתנגשויות יתרחשו לעיתים קרובות יותר.
        correct: false
        feedback: >-
          דחיסה מעלה גם את הלחץ הממוצע וגם את הפלוקטואציה המוחלטת, ומשאירה את היחס ביניהם
          על N^(-1/2).

  - id: Q-04-6
    type: multiple-choice
    objectives: [OBJ-04-5]
    prompt: >-
      באיזה מצב המודל הקינטי שבמודול הזה אמין פחות מכול?
    choices:
      - text: הליום בטמפרטורה של 4 קלווין ובצפיפות גבוהה, סמוך להתנזלות.
        correct: true
        feedback: >-
          נכון בשני היבטים. צפיפות גבוהה הופכת את הכוחות הבין-חלקיקיים ואת גודל החלקיקים
          למשמעותיים, וטמפרטורה נמוכה מכניסה לתמונה סטטיסטיקה קוונטית — שני אופני הכישלון
          שצוינו במפרט המודל.
      - text: חנקן בטמפרטורת החדר ובלחץ אטמוספרי.
        correct: false
        feedback: >-
          זהו מגרשו הביתי של המודל: המולקולות תופסות כאלפית מן הנפח והאפקטים הקוונטיים זניחים
          לחלוטין.
      - text: ארגון בתא ואקום בצפיפות נמוכה מאוד.
        correct: false
        feedback: >-
          צפיפות נמוכה הופכת את המודל ל*טוב יותר*, לא לגרוע יותר — זהו בדיוק הגבול הדליל שבו
          "ללא אינטראקציה" הוא תיאור מצוין.
      - text: אוויר בחדר גדול מאוד ולא בבקבוק קטן.
        correct: false
        feedback: >-
          גודל המיכל אינו רלוונטי לתקפות המודל; הצפיפות והטמפרטורה הן שקובעות. אם כבר, N גדול
          יותר הופך את התיאור המאקרוסקופי לחד יותר.

  - id: Q-04-7
    type: prediction
    objectives: [OBJ-04-1, OBJ-04-3]
    prompt: >-
      לפני קריאת הגזירה: אתם מכפילים את מספר החלקיקים בטמפרטורה ובנפח קבועים. נבאו מה קורה
      (א) ללחץ, (ב) לגודל היחסי של הפלוקטואציות שלו, (ג) לאנרגיה הקינטית הממוצעת לחלקיק.
    discussion: >-
      הלחץ מוכפל (הוא פרופורציוני ל-N בטמפרטורה ובנפח קבועים). הפלוקטואציה היחסית קטנה בשורש
      שתיים, שכן היא מתנהגת כמו N^(-1/2). האנרגיה הקינטית הממוצעת לחלקיק אינה משתנה — היא
      נקבעת על ידי הטמפרטורה בלבד, וזו בדיוק הסיבה שהטמפרטורה היא גודל אינטנסיבי שימושי. אם
      ניבאתם שהאנרגיה הממוצעת לחלקיק עולה עם N, אתם מתייחסים לטמפרטורה כאל מדד לאנרגיה
      כוללת; כדאי לתת לבלבול הזה שם עכשיו, אחרת הוא יצוץ מחדש בכל מודול הבא.

  - id: Q-04-8
    type: short-answer
    objectives: [OBJ-04-1]
    prompt: >-
      בשניים-שלושה משפטים, הסבירו מדוע הלחץ של גז יציב, באופן שלא ינבא גם (בטעות) שהלחץ של
      עשר מולקולות יציב.
    discussion: >-
      תשובה טובה מזהה את המנגנון כמיצוע על פני מספר גדול של אירועים בלתי תלויים, ומטילה את
      העבודה על גודלו של N: הפלוקטואציה המוחלטת גדלה כשורש N בעוד הסכום גדל כמו N, ולכן היחס
      דועך כמו N^(-1/2). עבור עשר מולקולות היחס הזה הוא כשלושים אחוזים, שאינו יציב כלל.
      תשובות האומרות "ההתנגשויות מתמצעות" בלי להזכיר את N אינן מבחינות בין שני המקרים וכדאי
      לדרוש מהן יותר.
