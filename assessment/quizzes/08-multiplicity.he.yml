module: 08-multiplicity
questions:
  - id: Q-08-1
    type: multiple-choice
    objectives: [OBJ-08-1]
    prompt: >-
      גז מבודד, המשוחרר מפינה קטנה של הכלי שלו, מתפשט למלא את כל הנפח, ולעולם אינו נצפה
      מתכנס מעצמו בחזרה אל הפינה. חוקי ניוטון הפיכים בזמן באופן מדויק. מה פותר את המתח
      הנראה לעין?
    choices:
      - text: שום דבר במכניקה אינו אוסר התכנסות מחדש; פשוט יש כל כך הרבה יותר מיקרו-מצבים המתאימים ל"מפוזר" עד שהתכנסות מחדש לעולם אינה נצפית בפועל.
        correct: true
        feedback: >-
          נכון. האי-סימטריה חיה כולה בספירה, לא בחוקי התנועה. מסלול הפוך-בזמן שמתכנס
          בחזרה עם הגז תקף מכנית בדיוק כמו זה שמפזר אותו — הוא פשוט נמצא במיעוט מוחץ.
      - text: התנגשויות בין מולקולות הגז אינן אלסטיות, ולכן אנרגיה קינטית הולכת לאיבוד והגז אינו יכול להתכנס בחזרה.
        correct: false
        feedback: >-
          המודל של המודול הזה אינו מניח פיזור אנרגיה כזה, ובכל מקרה התנגשויות מולקולריות
          אמיתיות משמרות אנרגיה קינטית בממוצע בגז בשיווי משקל. אובדן אנרגיה אינו מה שמונע
          התכנסות מחדש — הספירה היא זו שמונעת.
      - text: סימטריית היפוך הזמן היא רק בקירוב בסולם המולקולרי, ולכן התהליך ההפוך אסור מכנית.
        correct: false
        feedback: >-
          סימטריית היפוך הזמן של המכניקה הבסיסית אינה קירוב כאן — הפכו כל מהירות במסלול
          תקף ותקבלו מסלול תקף נוסף. התהליך ההפוך אינו אסור; הוא פשוט מיוצג על ידי שבר
          זעיר של המיקרו-מצבים הנגישים.
      - text: ברגע שהגז מגיע לשיווי משקל, המולקולות מפסיקות לנוע, כך שאין יותר מה להתכנס בחזרה.
        correct: false
        feedback: >-
          המולקולות לעולם אינן מפסיקות לנוע; שיווי משקל הוא טענה על ממוצע מאקרוסקופי, לא
          על תנועה פרטנית. זו אותה נקודה שמודול 04 מעלה לגבי כך שהלחץ לעולם אינו מתאפס
          בשיווי משקל.

  - id: Q-08-2
    type: multiple-choice
    objectives: [OBJ-08-2]
    prompt: >-
      "כל מיקרו-מצב נגיש של מערכת מבודדת הוא שווה-הסתברות." איזה סוג טענה זו, במסגרת
      שהמודול הזה בונה?
    choices:
      - text: הנחת יסוד — הבסיס שעליו נבנה שאר המודול, המוצדקת בהתאמה בין תוצאותיה לניסוי, ולא נגזרת מדבר יסודי יותר.
        correct: true
        feedback: >-
          נכון, וכדאי להיות מדויקים בעניין. שום דבר במודול הזה אינו מוכיח הסתברות שווה
          מחוקי ניוטון או מכל דבר אחר; היא מונחת, וכל מה שבא אחריה — ריבוי מצבים,
          אנטרופיה, שליטת החלוקה השווה — הוא תוצאה של אותה הנחה יחידה.
      - text: משפט, המוכח מחוקי ניוטון המיושמים על העצמים המתנגשים.
        correct: false
        feedback: >-
          לא ניתנת כאן הוכחה מחוקי ניוטון, ואף לא קיימת הוכחה כזו באופן כללי; ההנחה היא
          הנחת יסוד של המכניקה הסטטיסטית, לא משפט נגזר. בלבול בין השניים מסתיר בדיוק את
          מה שמונח.
      - text: קירוב התקף רק בטמפרטורה גבוהה.
        correct: false
        feedback: >-
          להנחת היסוד אין שום תלות בטמפרטורה במודל של המודול הזה — אין מלכתחילה הפרשי
          אנרגיה בין שני המצבים. הטמפרטורה נכנסת למכניקה הסטטיסטית במקום אחר, לא כאן.
      - text: ניסוח מחדש של שימור האנרגיה.
        correct: false
        feedback: >-
          שימור האנרגיה הוא טענה נפרדת (ובמודל של המודול הזה, כל המיקרו-מצבים חולקים את
          אותה אנרגיה מעצם הבנייה, כך ששימור אינו אומר דבר על איזה מהם תפוס). הסתברות
          שווה היא הנחה נוספת ובלתי תלויה.

  - id: Q-08-3
    type: multiple-choice
    objectives: [OBJ-08-3]
    prompt: >-
      מספר העצמים N במערכת דו-מצבית מוכפל פי ארבעה, כאשר כל השאר נשאר קבוע. מה קורה לרוחב
      היחסי של שיא ריבוי המצבים, sigma / (N/2)?
    choices:
      - text: הוא נחצה, מכיוון שהרוחב היחסי מתנהג כמו N^(-1/2), והכפלת N פי ארבעה חוצה את 1/sqrt(N).
        correct: true
        feedback: >-
          בדיוק. הרוחב היחסי הוא 1/sqrt(N) באופן מדויק, כך ש-N -> 4N הופך את 1/sqrt(N)
          ל-1/sqrt(4N) = (1/2) * 1/sqrt(N) — השיא נעשה חד פי שניים, באופן יחסי.
      - text: הוא נעשה רבע, מכיוון ש-N מופיע בחזקה ראשונה בנוסחת ריבוי המצבים.
        correct: false
        feedback: >-
          הרוחב היחסי מתנהג כמו N^(-1/2), לא כמו N^(-1). הכפלת N פי ארבעה משנה את
          1/sqrt(N) בגורם של 1/sqrt(4) = 1/2, לא 1/4.
      - text: הוא מוכפל, משום שיש יותר עצמים ולכן יותר דרכים לסטות מהחלוקה השווה.
        correct: false
        feedback: >-
          אכן יש יותר דרכים לסטות במונחים מוחלטים, אך יש עוד יותר דרכים לשבת בקרבת השיא,
          והיחס — וזה בדיוק מה ש"רוחב יחסי" מודד — יורד, לא עולה, ככל ש-N גדל.
      - text: הוא אינו משתנה, משום שהחלוקה השווה n = N/2 תמיד שולטת ללא תלות ב-N.
        correct: false
        feedback: >-
          שליטת החלוקה השווה נכונה בכל N, אך "שליטה" נעשית קיצונית יותר ככל ש-N גדל —
          החידוד הזה הוא בדיוק מה שהרוחב היחסי המצטמצם מתאר. הרוחב אינו בלתי תלוי ב-N.

  - id: Q-08-4
    type: numeric
    objectives: [OBJ-08-3]
    prompt: >-
      עבור מערכת דו-מצבית של N = 1,000,000 עצמים, השתמשו בחוק N^(-1/2) כדי להעריך את
      הרוחב היחסי של שיא ריבוי המצבים, sigma / (N/2). תנו את התשובה כשבר עשרוני.
    answer: 0.001
    tolerance: 0.0002
    feedback: >-
      sigma / (N/2) = N^(-1/2) = 1/1000 = 0.001, כלומר 0.1%. אותו חוק שנתן למול גז
      פלוקטואציית לחץ בלתי ניתנת לגילוי במודול 04 נותן לשיא ריבוי מצבים בסדר גודל של מול
      רוחב יחסי של כ-1.3e-12 — הסיבה לכך שמערכות מאקרוסקופיות לעולם אינן נודדות רחוק
      מהחלוקה השווה.

  - id: Q-08-5
    type: multiple-choice
    objectives: [OBJ-08-6]
    misconception: entropy-is-disorder
    prompt: >-
      שני גבישים של אותו יסוד נראים זהים תחת מיקרוסקופ: אותו מבנה סריג, אותה צפיפות.
      האחד הוא איזוטופ יחיד. השני הוא תערובת אקראית של 50/50 בין שני איזוטופים של אותו
      יסוד, על אותו סריג. השוו את האנטרופיות שלהם.
    choices:
      - text: לגביש המעורב יש אנטרופיה גבוהה בהרבה, משום שהאנטרופיה סופרת את מספר המיקרו-מצבים הנגישים, ויש דרכים רבות באופן אסטרונומי לסדר שני איזוטופים על פני אתרי הסריג — אף על פי ששום דבר במראה אינו משתנה.
        correct: true
        feedback: >-
          נכון. ריבוי המצבים(1000, 500) הוא כ-2.7e299 עבור הגביש המעורב לעומת Omega=1
          עבור הטהור, מה שנותן לגביש המעורב כ-690 k_B של אנטרופיה שלגביש הטהור פשוט אין.
          שום דבר באף אחד מהגבישים אינו נראה "בלתי מסודר" יותר — ההבדל טמון כולו במספר
          המיקרו-מצבים החולקים את המאקרו-מצב הנראה לעין.
      - text: יש להם אנטרופיה שווה, מכיוון שאף אחד מהגבישים אינו נראה בלתי מסודר, והאנטרופיה היא מדד לאי-סדר נראה לעין.
        correct: false
        feedback: >-
          זוהי בדיוק האינטואיציה שהדוגמה הזו נועדה לשבור. האנטרופיה היא k_B ln Omega,
          ספירה של מיקרו-מצבים, לא מדד למידת הבלגן הנראית לעין. שני הגבישים נראים
          מסודרים באותה מידה ובעלי אנטרופיות שונות מאוד.
      - text: לגביש הטהור יש אנטרופיה גבוהה יותר, משום ששמירה על טוהר איזוטופי דורשת יותר סדר מבני.
        correct: false
        feedback: >-
          זה הופך את ההשוואה על פיה, ובנוסף מייבא את מושג ה"סדר" כאילו הוא מכריע את
          השאלה. לגביש הטהור יש בדיוק מיקרו-מצב אחד (Omega = 1, S = 0); לגביש המעורב יש
          מספר עצום מהם.
      - text: אי אפשר להשוות אנטרופיה בין שני הגבישים אלא אם אחד מהם מבולגן באופן נראה לעין יותר מהשני.
        correct: false
        feedback: >-
          האנטרופיה מוגדרת היטב עבור שני המאקרו-מצבים ללא תלות במראה — היא מחושבת
          מריבוי המצבים של כל אחד מהם, לא מבדיקה חזותית. ההשוואה בשאלה הזו היא בדיוק
          מהסוג שנוסחת בולצמן נועדה לבצע.

  - id: Q-08-6
    type: multiple-choice
    objectives: [OBJ-08-4, OBJ-08-6]
    misconception: subsystem-entropy-increase
    prompt: >-
      שתי תת-מערכות בלתי תלויות, A ו-B, הן חלק ממערכת מבודדת גדולה אחת. במרוצת הזמן,
      האנטרופיה של תת-מערכת A יורדת בעוד זו של B עולה בכמות גדולה יותר, כך שהאנטרופיה
      המשולבת S_A + S_B עולה. האם זה עקבי עם החוק השני כפי שפותח במודול הזה?
    choices:
      - text: כן — החוק השני כאן מגביל רק את האנטרופיה הכוללת של המערכת המשולבת המבודדת; הוא אינו מטיל שום דרישה על האנטרופיה של אף תת-מערכת בודדת.
        correct: true
        feedback: >-
          נכון. מכיוון ש-Omega_AB = Omega_A * Omega_B עבור תת-מערכות בלתי תלויות,
          האנטרופיות מצטרפות באופן מדויק: S_AB = S_A + S_B. שום דבר באדיטיביות הזו אינו
          מחייב שכל איבר ינוע באותו כיוון — רק הסכום שלהם מוגבל לעלות (בדרך כלל) עבור
          השלם המבודד.
      - text: לא — האנטרופיה של כל תת-מערכת חייבת לעלות בנפרד, ולכן התרחיש הזה בלתי אפשרי מבחינה פיזיקלית.
        correct: false
        feedback: >-
          זו התפיסה השגויה שהדוגמה הזו נועדה להפריך. מקרה מחושב בסעיף המתקדם של המודול
          נותן מספרים קונקרטיים: האנטרופיה של תת-מערכת A יורדת בכ-0.17 k_B בעוד זו של B
          עולה בכ-133.8 k_B, והסך הכול עולה. שום דבר בגזירה אינו אוסר על האנטרופיה של
          תת-מערכת לרדת.
      - text: לא, אלא אם A ו-B מחליפות אנרגיה, ובמקרה כזה כל שינוי מותר.
        correct: false
        feedback: >-
          ההיתר אינו תלוי בהחלפת אנרגיה באופן ספציפי — הוא נובע ישירות מאדיטיביות
          האנטרופיה על פני תת-מערכות בלתי תלויות, המתקיימת בכל פעם ש-Omega_AB = Omega_A
          * Omega_B, ללא תלות במה שמוחלף.
      - text: כן, אבל רק משום שהאנטרופיה הכוללת ירדה בסך הכול, מה שמפצה על כך.
        correct: false
        feedback: >-
          ההנחה קובעת במפורש שהאנטרופיה המשולבת עולה, לא יורדת. העקביות כאן אינה דורשת
          שום ירידה מפצה במקום אחר — היא דורשת רק שסכום האנטרופיות של שתי תת-המערכות לא
          ירד.

  - id: Q-08-7
    type: prediction
    objectives: [OBJ-08-1, OBJ-08-3]
    prompt: >-
      לפני קריאת הגזירה: גודלה N של מערכת דו-מצבית גדל פי עשרה. נבאו מה קורה (א) לריבוי
      המצבים של החלוקה השווה, Omega(N, N/2), (ב) לרוחב היחסי של שיא ריבוי המצבים, ו-(ג)
      להסתברות של המאקרו-מצב הקיצוני המסודר לחלוטין, n = 0.
    discussion: >-
      Omega(N, N/2) גדלה באופן עצום — הלוגריתם שלה גדל בקירוב באופן ליניארי ב-N (ln Omega
      ~ N ln 2), כך ש-Omega עצמה גדלה אקספוננציאלית עם N, הרבה יותר מהר מפי עשרה. הרוחב
      היחסי של השיא מצטמצם בגורם של sqrt(10) ~ 3.16, בהתאם לחוק N^(-1/2). ההסתברות של
      הקיצון המסודר לחלוטין, P(0) = 1/2^N, קורסת: הכפלת N פי עשרה מכפילה את המעריך פי
      עשרה, כך ש-P(0) מועלה בקירוב בחזקה העשירית של עצמה — מספר שכבר זעיר נעשה קטן מעבר
      לכל תפיסה. אם ניבאתם ששלושת הגדלים ישתנו בכמויות דומות, "בסביבות פי עשרה," שימו לב
      עד כמה שונה בפועל התגובה של שלושת הגדלים האלה לאותו שינוי ב-N; ההבדל הזה הוא כל
      תוכן המודול הזה.

  - id: Q-08-8
    type: short-answer
    objectives: [OBJ-08-1, OBJ-08-6]
    prompt: >-
      בשניים-שלושה משפטים, הסבירו מדוע גז מבודד לעולם אינו מתקבץ מעצמו בפינה אחת, באופן
      שלא ינבא גם (בטעות) שעשר מולקולות גז לעולם לא יכולות להימצא מקובצות באזור אחד
      במקרה.
    discussion: >-
      תשובה טובה מזהה את המנגנון כספירה: למאקרו-מצב "מפוזר" יש באופן מכריע יותר
      מיקרו-מצבים נגישים מאשר ל"מקובץ", ומטילה את העבודה על גודלו של N, מכיוון
      שהשליטה היחסית של המאקרו-מצב המפוזר גדלה עם N ואינה מוחלטת. עבור עשר מולקולות,
      המאקרו-מצבים ה"מקובצים" אינם נדירים באופן זניח כלל — מערכות קטנות מפגינות תנודות
      נראות לעין לכיוון תצורות לא טיפוסיות. תשובות האומרות "זה אסור" או "זה פשוט מה
      שגזים עושים" בלי להתייחס ל-N אינן מבחינות בין שני המקרים וכדאי לדרוש מהן יותר.

  - id: Q-08-9
    type: multiple-choice
    objectives: [OBJ-08-5]
    prompt: >-
      ככל ש-N גדל, איך מתנהג הפער היחסי בין S(2N, N) לבין 2 S(N, N/2) — המבחן לשאלה האם
      אנטרופיית בולצמן אקסטנסיבית באופן מדויק?
    choices:
      - text: הוא מצטמצם לעבר אפס ככל ש-N גדל, אך אינו אפס מדויק עבור שום N סופי.
        correct: true
        feedback: >-
          נכון. הפער נקבע על ידי האיבר המשני, הלוגריתמי, בקירוב סטירלינג, בקירוב
          (1/2) ln(pi N), מחולק באיבר המוביל האקסטנסיבי, N ln 2. היחס הזה יורד עם N אך
          לעולם אינו מגיע בדיוק לאפס עבור N סופי — אקסטנסיביות היא טענה על הגבול
          התרמודינמי, לא זהות.
      - text: הוא אפס מדויק עבור כל N, מכיוון שהאנטרופיה אקסטנסיבית מעצם ההגדרה.
        correct: false
        feedback: >-
          אקסטנסיביות אינה מובנית בתוך ההגדרה S = k_B ln Omega; זהו דבר שהקומבינטוריקה
          מספקת רק בקירוב, כאשר הקירוב משתפר ככל ש-N גדל. במדידה ישירה, הפער הוא כ-0.9%
          ב-N=200 וכ-0.002% ב-N=200,000 — קטן, אך לא אפס.
      - text: הוא גדל ללא גבול ככל ש-N גדל, מכיוון שלמערכות גדולות יותר יש יותר דרכים לסטות.
        correct: false
        feedback: >-
          ההפך הוא מה שנמדד: הפער מצטמצם ככל ש-N גדל, משום שהאיבר המוביל באנטרופיה
          (הפרופורציוני ל-N) גדל מהר יותר מהתיקון המשני (הפרופורציוני ל-ln N).
      - text: הוא תלוי רק בשאלה האם N זוגי או אי-זוגי, לא בגודלו של N.
        correct: false
        feedback: >-
          הפער נקבע על ידי גודלו של N דרך איבר התיקון הלוגריתמי, לא על ידי זוגיות. הוא
          מצטמצם באופן שיטתי וצפוי ככל ש-N גדל.
