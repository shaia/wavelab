module: 06-coupled
questions:
  - id: Q-06-1
    type: multiple-choice
    objectives: [OBJ-06-2]
    misconception: energy-stays-in-excited-pendulum
    prompt: >-
      שתי מטוטלות זהות תלויות מתלייה משותפת, מצומדות חלושות. אתם מניעים אחת ומשאירים את השנייה
      דוממת, ואז צופים במשך כמה דקות. אין חיכוך. מה קורה לאנרגיה?
    choices:
      - text: היא עוברת במלואה למטוטלת השנייה, ואז במלואה בחזרה, שוב ושוב.
        correct: true
        feedback: >-
          נכון. הנעת מטוטלת אחת מעוררת את שני אופני התנודה במידה שווה, והם רצים בתדירויות
          שונות במעט, ולכן הם יוצאים מסנכרון וחוזרים אליו. כשהם מחוץ לסנכרון התנועה עברה
          כולה למטוטלת השנייה. בצימוד חלש האנרגיה של המטוטלת הראשונה יורדת מתחת ל-0.1%
          מהסך הכול לפני שהיא חוזרת.
      - text: רובה נשארת במטוטלת הראשונה, וכמות קטנה דולפת הלוך ושוב.
        correct: false
        feedback: >-
          זו האינטואיציה שיש לוותר עליה. דבר אינו מגביל את ההעברה: משרעות שני האופנים שוות,
          ולכן הנקישה ביניהן יורדת עד אפס עבור מטוטלת אחת ועולה עד המלוא עבור השנייה. הדמו
          זאת וצפו בעמודות האנרגיה — המטוטלת הראשונה נעצרת לגמרי, ללא שום חיכוך שיעצור אותה.
      - text: היא מתייצבת בחלוקה שווה, ושתי המטוטלות מתנדנדות בחצי משרעת לנצח.
        correct: false
        feedback: >-
          חלוקה שווה הייתה דורשת משהו שיפזר את ההפרש ויחזיק את המצב שם, והמודל משמר לחלוטין.
          התנועה מחזורית: היא עוברת דרך החלוקה השווה פעמיים בכל מחזור חילופין וממשיכה הלאה.
      - text: המטוטלת הראשונה נעצרת בהדרגה ונשארת עצורה, ואנרגייתה אובדת לתלייה.
        correct: false
        feedback: >-
          היא אכן נעצרת — החלק הזה נכון והוא ההפתעה. אבל דבר לא אובד: אין שום איבר ריסון
          במודל, והאנרגיה הכוללת קבועה לאורך כל הדרך. המתינו עוד חצי מחזור חילופין והמטוטלת
          הראשונה מתנדנדת ברוחב שבו שחררתם אותה.

  - id: Q-06-2
    type: numeric
    objectives: [OBJ-06-3]
    prompt: >-
      לזוג מצומד יש תדירויות זוויתיות של אופני תנודה omega_s = 4.000 rad/s ו-
      omega_a = 4.195 rad/s. כמה זמן, בשניות, לוקח לאנרגיה לעבור ממתנד אחד לשני ולחזור?
    answer: 32.2
    tolerance: 1.0
    feedback: >-
      T_ex = 2 pi / (omega_a - omega_s) = 2 pi / 0.195 = 32.2 שניות. רק הפיצול חשוב;
      תדירויות האופנים עצמן מתבטלות לחלוטין, וזו הסיבה שמדידת זמן של חילופין איטיים היא דרך
      למדוד הפרש תדירויות קטן בהרבה מכדי להיפרד בספקטרום. העברה מלאה מתרחשת בחצי מזה, בערך
      16 שניות.

  - id: Q-06-3
    type: multiple-choice
    objectives: [OBJ-06-2]
    prompt: >-
      עבור שני מתנדים זהים מצומדים, בכמה דרכים אפשר להתחיל אותם ממנוחה כך שלעולם לא תוחלף
      אנרגיה ביניהם, ומהן ההתחלות האלה?
    choices:
      - text: שתיים — להסיט את שתיהן במידה שווה לאותו כיוון, או להסיט את שתיהן במידה שווה לכיוונים מנוגדים.
        correct: true
        feedback: >-
          נכון, והספירה אינה מקרית: שתי מסות נותנות שני אופני תנודה. בראשון קפיץ הצימוד אינו
          משנה את אורכו לעולם, ולכן הזוג מתנדנד בתדירות הלא-מצומדת omega0. בשני הוא עובד קשה
          ביותר, ולכן התדירות גבוהה יותר, sqrt((k + 2 k_c)/m). כל התחלה אחרת היא תערובת של
          השתיים, ותערובות משכשכות.
      - text: אחת — להסיט את שתיהן במידה שווה לאותו כיוון, כך שקפיץ הצימוד אינו עושה דבר.
        correct: false
        feedback: >-
          זו אחת מהן, והיא הקלה יותר לניחוש. אבל ההתחלה ההפוכה — הסטות שוות בכיוונים מנוגדים —
          גם היא מתנודדת בתדירות יחידה ולעולם אינה מחליפה. זהו האופן שבו קפיץ הצימוד עובד קשה
          ביותר, וזו הסיבה שתדירותו הגבוהה מבין השתיים.
      - text: אינסוף — כל התחלה שבה x1 = x2 ביחס קבוע כלשהו תתאים.
        correct: false
        feedback: >-
          רק שני יחסים עובדים, ‎+1 ו-‎-1. נסו כל יחס אחר בסימולציה והאנרגיה תשכשך. הסיבה היא
          שלתנאי הדטרמיננטה יש בדיוק שני שורשים, וכל שורש קובע את צורתו במלואה.
      - text: אף אחת — כל התחלה שהיא תחליף אנרגיה בסופו של דבר, בהינתן מספיק זמן.
        correct: false
        feedback: >-
          שתי ההתחלות המיוחדות באמת אינן מחליפות לעולם. זה מה שהופך אותן לראויות לשם, ומציאתן
          היא תכלית המודול: אלה התנועות שבהן המערכת המצומדת מתנהגת כמתנד הרמוני פשוט יחיד.

  - id: Q-06-4
    type: short-answer
    objectives: [OBJ-06-1]
    prompt: >-
      שתי מסות m מונחות על שולחן חסר חיכוך. מסה 1 מחוברת לקיר שמאלי בקפיץ בקשיחות k1, מסה 2
      לקיר ימני בקפיץ k2, ושתי המסות זו לזו בקפיץ k_c. רשמו את משוואות התנועה והרכיבו את
      המטריצות M ו-K. אחר כך אמרו כיצד הייתם מזהים, מתוך K בלבד, אם שני המתנדים מצומדים בכלל.
    discussion: >-
      ניוטון לכל מסה. מסה 1 חשה את קפיץ הקיר שלה, ‎-k1 x1, ואת קפיץ הצימוד, המגיב ל*שינוי
      במרחק*, ‎-k_c (x1 - x2). מסה 2 בדומה, עם ‎-k2 x2 ו-‎-k_c (x2 - x1). לכן

        m x1'' = -k1 x1 - k_c (x1 - x2),    m x2'' = -k2 x2 - k_c (x2 - x1).

      איסוף לצורה M x'' + K x = 0 נותן M = m * מטריצת היחידה ו-

        K = [[k1 + k_c, -k_c], [-k_c, k2 + k_c]].

      שני דברים ראויים לתשומת לב. הצימוד מופיע על האלכסון וגם מחוצה לו — כל מסה מוחזקת קשיח
      מעט יותר משקפיץ הקיר שלה לבדו היה מחזיק אותה, מפני שגם קפיץ הצימוד מתנגד לתנועתה.
      ו-K סימטרית, וזה אינו מקרה: זה נובע מכך שהאנרגיה הפוטנציאלית היא פונקציה סקלרית אחת,
      וזה מה שמבטיח תדירויות ממשיות ואופנים שאינם משכשכים.

      הצימוד נראה ב-K כאיברים שמחוץ לאלכסון. אם K אלכסונית המשוואות נפרדות לחלוטין והמסות
      אינן משפיעות זו על זו לעולם. שימו לב שזו אמירה על הקואורדינטות לא פחות מאשר על הפיזיקה:
      כל תכליתן של הקואורדינטות הנורמליות היא שהן אלה שבהן K *כן* אלכסונית.

  - id: Q-06-5
    type: numeric
    objectives: [OBJ-06-5]
    prompt: >-
      שני מתנדים זהים בעלי תדירות עצמית omega0 = 10.0 rad/s מצומדים חלושות עם k_c/k = 0.040.
      בעזרת אומדן הצימוד החלש, מהו פיצול האופנים omega_a - omega_s, ביחידות rad/s?
    answer: 0.40
    tolerance: 0.04
    feedback: >-
      Delta omega approx omega0 k_c / k = 10.0 * 0.040 = 0.40 rad/s. הערך המדויק קטן מעט
      יותר, 0.398, מפני ש-sqrt(1 + 2 k_c/k) נמצא מעט מתחת ל-1 + k_c/k; ב-k_c/k = 0.04 זה
      תיקון של 0.5%. זמן החילופין הוא 2 pi / 0.40 = 16 שניות, בערך 25 מחזורי תנודה, ולכן
      הזוג מתנדנד פעמים נקיות רבות בעוד משרעתו נודדת — החתימה של צימוד חלש.

  - id: Q-06-6
    type: short-answer
    objectives: [OBJ-06-4]
    prompt: >-
      הראו שהקואורדינטות הנורמליות q_plus = (x1 + x2)/sqrt(2) ו-q_minus = (x1 - x2)/sqrt(2)
      הופכות את שתי משוואות התנועה המצומדות לשתיים בלתי תלויות. אחר כך הסבירו מה בעצם הושג,
      בהינתן שלא נוסף ולא הוסר שום מידע.
    discussion: >-
      התחילו מ-m x1'' = -k x1 - k_c (x1 - x2) ומ-m x2'' = -k x2 - k_c (x2 - x1).

      חברו אותן. איברי הצימוד הם ‎-k_c (x1 - x2) ו-‎-k_c (x2 - x1), השווים והמנוגדים, ולכן הם
      מתבטלים בדיוק: m (x1 + x2)'' = -k (x1 + x2), כלומר q_plus'' + omega0^2 q_plus = 0.

      החסירו אותן. כעת איברי הצימוד מתחזקים, ותורמים ‎-2 k_c (x1 - x2), ונותנים
      m (x1 - x2)'' = -(k + 2 k_c)(x1 - x2), כלומר q_minus'' + omega_a^2 q_minus = 0 עם
      omega_a^2 = (k + 2 k_c)/m.

      כל אחת היא מתנד ממודול 01 בלי שום התייחסות לאחר. מה שהושג אינו מידע חדש — q_plus
      ו-q_minus נושאות בדיוק את מה ש-x1 ו-x2 נושאות, וההעתקה הפיכה — אלא *תיאור* חדש. הצימוד
      מעולם לא היה תכונה של הפיזיקה; הוא היה תכונה של הקואורדינטות שנבחרו לתאר אותה, ובחירה
      אחרת מסלקת אותו לחלוטין.

      זו הסיבה שהאופנים שווים את הטרחה. בתמונת האתרים עליכם לפתור שתי משוואות המתייחסות זו
      לזו; בתמונת האופנים אתם פותרים שתיים שאתם כבר יודעים את תשובתן, ואז ממירים חזרה. מודול
      07 עושה את אותו הדבר עבור N מסות, שם ניחוש הצירופים הנכונים בעין מפסיק להיות אפשרי
      והמכונה חייבת להיבנות כראוי.
