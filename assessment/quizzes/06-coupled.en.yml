module: 06-coupled
questions:
  - id: Q-06-1
    type: multiple-choice
    objectives: [OBJ-06-2]
    misconception: energy-stays-in-excited-pendulum
    prompt: >-
      Two identical pendulums hang from a shared support, weakly coupled. You start one
      swinging and leave the other still, then watch for several minutes. There is no friction.
      What happens to the energy?
    choices:
      - text: It travels completely to the second pendulum, then completely back, over and over.
        correct: true
        feedback: >-
          Right. Starting one pendulum excites both normal modes equally, and they run at
          slightly different frequencies, so they drift out of step and back into step. When
          they are out of step the motion has moved entirely to the other pendulum. At weak
          coupling the first pendulum's energy falls below 0.1% of the total before returning.
      - text: Most of it stays in the first pendulum, with a small amount leaking back and forth.
        correct: false
        feedback: >-
          This is the intuition to give up. Nothing limits the transfer: the two mode
          amplitudes are equal, so the beat between them goes all the way to zero for one
          pendulum and all the way to full for the other. Simulate it and watch the energy bars
          — the first pendulum stops completely, without any friction to stop it.
      - text: It settles into an even split, with both pendulums swinging at half amplitude for ever.
        correct: false
        feedback: >-
          An even split would need something to dissipate the difference and hold the state
          there, and the model is perfectly conservative. The motion is periodic: it passes
          through the even split twice per exchange period and keeps going.
      - text: The first pendulum gradually stops and stays stopped, its energy lost to the support.
        correct: false
        feedback: >-
          It does stop — that part is right and is the surprise. But nothing is lost: there is
          no damping term anywhere in the model, and the total energy is constant throughout.
          Wait one more half exchange period and the first pendulum is swinging as widely as
          when you released it.

  - id: Q-06-2
    type: numeric
    objectives: [OBJ-06-3]
    prompt: >-
      A coupled pair has normal-mode angular frequencies omega_s = 4.000 rad/s and
      omega_a = 4.195 rad/s. How long does it take, in seconds, for the energy to pass from one
      oscillator to the other and return?
    answer: 32.2
    tolerance: 1.0
    feedback: >-
      T_ex = 2 pi / (omega_a - omega_s) = 2 pi / 0.195 = 32.2 s. Only the splitting matters;
      the mode frequencies themselves cancel out entirely, which is why timing a slow exchange
      is a way to measure a frequency difference far too small to resolve on a spectrum. Full
      transfer happens at half this, about 16 s.

  - id: Q-06-3
    type: multiple-choice
    objectives: [OBJ-06-2]
    prompt: >-
      For two identical coupled oscillators, how many ways are there to start them from rest so
      that no energy is ever exchanged between them, and what are those starts?
    choices:
      - text: Two — displace both equally in the same direction, or displace both equally in opposite directions.
        correct: true
        feedback: >-
          Right, and the count is not a coincidence: two masses give two normal modes. In the
          first the coupling spring never changes length, so the pair swings at the uncoupled
          frequency omega0. In the second it is worked hardest, so the frequency is higher,
          sqrt((k + 2 k_c)/m). Every other start is a mixture of these two, and mixtures slosh.
      - text: One — displace both equally in the same direction, so the coupling spring does nothing.
        correct: false
        feedback: >-
          That is one of them, and it is the easier one to guess. But the opposite start —
          equal displacements in opposite directions — also oscillates at a single frequency
          and never trades. It is the mode in which the coupling spring works hardest, which is
          why its frequency is the higher of the two.
      - text: Infinitely many — any start with x1 = x2 in some fixed ratio will do.
        correct: false
        feedback: >-
          Only two ratios work, +1 and -1. Try any other in simulation and the energy sloshes.
          The reason is that the determinant condition has exactly two roots, and each root
          fixes its shape completely.
      - text: None — any start at all will eventually exchange energy, given enough time.
        correct: false
        feedback: >-
          The two special starts genuinely never exchange, for ever. That is what makes them
          worth a name, and finding them is the point of the module: they are the motions in
          which the coupled system behaves like a single simple oscillator.

  - id: Q-06-4
    type: short-answer
    objectives: [OBJ-06-1]
    prompt: >-
      Two masses m sit on a frictionless table. Mass 1 is joined to a left wall by a spring of
      stiffness k1, mass 2 to a right wall by a spring k2, and the two masses to each other by
      a spring k_c. Write the equations of motion and assemble the matrices M and K. Then say
      how you would recognise, from K alone, whether the two oscillators are coupled at all.
    discussion: >-
      Newton for each mass. Mass 1 feels its own wall spring, -k1 x1, and the coupling spring,
      which responds to the *change in separation*, -k_c (x1 - x2). Mass 2 likewise, with
      -k2 x2 and -k_c (x2 - x1). So

        m x1'' = -k1 x1 - k_c (x1 - x2),    m x2'' = -k2 x2 - k_c (x2 - x1).

      Collecting into M x'' + K x = 0 gives M = m * identity and

        K = [[k1 + k_c, -k_c], [-k_c, k2 + k_c]].

      Two things are worth noticing. The coupling appears on the diagonal as well as off it —
      each mass is held a little more stiffly than its own wall spring alone would hold it,
      because the coupling spring also resists its motion. And K is symmetric, which is not a
      coincidence: it follows from the potential energy being a single scalar function, and it
      is what guarantees real frequencies and non-sloshing modes.

      Coupling is visible in K as the off-diagonal entries. If K is diagonal the equations
      separate completely and the masses never influence each other. Note that this is a
      statement about the coordinates as much as about the physics: the whole point of normal
      coordinates is that they are the ones in which K *is* diagonal.

  - id: Q-06-5
    type: numeric
    objectives: [OBJ-06-5]
    prompt: >-
      Two identical oscillators with natural frequency omega0 = 10.0 rad/s are weakly coupled
      with k_c/k = 0.040. Using the weak-coupling estimate, what is the mode splitting
      omega_a - omega_s, in rad/s?
    answer: 0.40
    tolerance: 0.04
    feedback: >-
      Delta omega approx omega0 k_c / k = 10.0 * 0.040 = 0.40 rad/s. The exact value is
      slightly smaller, 0.398, because sqrt(1 + 2 k_c/k) is a little below 1 + k_c/k; at
      k_c/k = 0.04 that is a 0.5% correction. The exchange time is 2 pi / 0.40 = 16 s, about 25
      oscillation periods, so the pair swings many clean times while its amplitude drifts —
      the signature of weak coupling.

  - id: Q-06-6
    type: short-answer
    objectives: [OBJ-06-4]
    prompt: >-
      Show that the normal coordinates q_plus = (x1 + x2)/sqrt(2) and q_minus = (x1 - x2)/sqrt(2)
      turn the two coupled equations of motion into two independent ones. Then explain what has
      actually been achieved, given that no information was added or removed.
    discussion: >-
      Start from m x1'' = -k x1 - k_c (x1 - x2) and m x2'' = -k x2 - k_c (x2 - x1).

      Add them. The coupling terms are -k_c (x1 - x2) and -k_c (x2 - x1), which are equal and
      opposite, so they cancel exactly: m (x1 + x2)'' = -k (x1 + x2), that is
      q_plus'' + omega0^2 q_plus = 0.

      Subtract them. Now the coupling terms reinforce, contributing -2 k_c (x1 - x2), giving
      m (x1 - x2)'' = -(k + 2 k_c)(x1 - x2), that is q_minus'' + omega_a^2 q_minus = 0 with
      omega_a^2 = (k + 2 k_c)/m.

      Each is a module-01 oscillator with no reference to the other. What has been achieved is
      not new information — q_plus and q_minus carry exactly what x1 and x2 carry, and the
      transformation is invertible — but a new *description*. The coupling was never a property
      of the physics; it was a property of the coordinates chosen to describe it, and a
      different choice removes it entirely.

      That is why the modes are worth the trouble. In the site picture you must solve two
      equations that refer to each other; in the mode picture you solve two you already know
      the answer to, then transform back. Module 07 does the same thing for N masses, where
      guessing the right combinations by inspection stops being possible and the machinery has
      to be built properly.
