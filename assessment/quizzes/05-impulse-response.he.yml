module: 05-impulse-response
questions:
  - id: Q-05-1
    type: multiple-choice
    objectives: [OBJ-05-1]
    prompt: >-
      מכים בפעמון במקוש לבד, ואז בפטיש פלדה בעל אותה מסה הנע באותה מהירות. בהשוואה למכת
      הלבד, מה משנה מכת הפלדה בצליל?
    choices:
      - text: את המשרעת, ואת התמהיל של האופנים העצמיים של הפעמון שהיא מעוררת — אך לא את התדירות של אף אופן.
        correct: true
        feedback: >-
          נכון. בעיטה קובעת מהירות ותו לא, ולכן התנועה שאחריה היא דעיכה חופשית: היא מצלצלת
          ב-omega_d, ששייכת לפעמון. מכה חזקה וקצרה יותר מספקת מתקף גדול יותר וספקטרום שטוח
          יותר, ולכן היא מזינה את האופנים הגבוהים חזק יותר — בהיר יותר, חזק יותר, אותם
          גבהים.
      - text: את תדירות הצלצול, מפני שפגיעה קשיחה יותר מניעה את הפעמון מהר יותר.
        correct: false
        feedback: >-
          הפגיעה אינה מניעה דבר לאחר שהסתיימה, והיא מסתיימת כמעט מיד. ברגע שהפטיש עזב, אין
          במשוואת התנועה איבר כוח כלל, ולכן הפעמון פותר את בעיית הדעיכה החופשית שלו
          ב-omega_d שלו. שום דבר מהמקוש אינו מופיע בתדירות הזו.
      - text: את קצב הדעיכה, מפני שמכה חזקה יותר מכניסה יותר אנרגיה ולוקח יותר זמן לפזר אותה.
        correct: false
        feedback: >-
          הדעיכה מעריכית, ולכן הזמן לירידה ב*פקטור* נתון אינו תלוי בנקודת ההתחלה: gamma/2
          היא תכונה של הפעמון. מכה חזקה יותר נשמעת ארוכה יותר רק במובן שהיא מתחילה גבוה
          יותר על אותה מעריכית.
      - text: שום דבר מדיד — תגובת המתקף היא תכונה קבועה של הפעמון.
        correct: false
        feedback: >-
          G(t) אכן קבועה, אך התגובה היא G מוכפלת במתקף J, ולכן המשרעת בהחלט משתנה. הטענה
          שאינה משתנה צרה ומעניינת יותר: ה*צורה* בזמן היא תמיד אותה צורה, ורק גודלה נתון
          לבחירתכם.

  - id: Q-05-2
    type: multiple-choice
    objectives: [OBJ-05-2]
    prompt: >-
      מתנד בעל Q = 10 נבעט פעמיים במתקפים שווים, כשהבעיטה השנייה נוחתת בדיוק חצי מחזור אחרי
      הראשונה. כיצד נראה הצלצול שאחר כך?
    choices:
      - text: כמעט מבוטל, בערך 15% מבעיטה בודדת — אך לא אפס בדיוק.
        correct: true
        feedback: >-
          נכון. חצי מחזור מציב את שתי התרומות באנטי-פאזה, ולכן הן מתחסרות, ויחס המשרעות הוא
          1 - e^(-pi/2Q) = 0.15 ב-Q = 10. זה אינו אפס מפני שהצלצול של הבעיטה הראשונה כבר
          דעך מעט עד שהשנייה הגיעה, ולכן שתי המשרעות המתחסרות אינן שוות.
      - text: מבוטל בדיוק — שתי התרומות באנטי-פאזה והורסות זו את זו לחלוטין.
        correct: false
        feedback: >-
          הן אכן באנטי-פאזה, אך ביטול דורש גם משרעות שוות, והריסון כיווץ את הראשונה
          ב-e^(-pi/2Q) לפני שהשנייה הגיעה. ביטול מדויק היה דורש ש-Q יהיה אינסופי, וזהו
          המתנד הבלתי מרוסן שלעולם אינו נרגע.
      - text: כפול — שתי בעיטות מכניסות פי שניים מתקף, ולכן התגובה גדולה פי שניים.
        correct: false
        feedback: >-
          מתקפים אכן מתחברים, אך תגובות מתחברות *כפונקציות מסומנות של הזמן*, וכאן השנייה
          מגיעה כשהתרומה הראשונה נעה בכיוון ההפוך. הכפלה היא מה שמתקבל מבעיטות במרווח מחזור
          שלם, וגם אז רק פי 1 + e^(-pi/Q) = 1.73, לא פי 2.
      - text: ללא שינוי — הבעיטה השנייה מגיעה כשהמסה בנקודת המפנה שלה ואינה מבצעת עבודה.
        correct: false
        feedback: >-
          בעיטה משנה את המהירות ללא תלות במקום שבו המסה נמצאת במקרה, ולכן היא תמיד משנה את
          התנועה. מה שהתזמון מחליט הוא ה*סימן* של השינוי הזה ביחס לצלצול הקיים.

  - id: Q-05-3
    type: multiple-choice
    objectives: [OBJ-05-2, OBJ-05-4]
    misconception: response-follows-force-shape
    prompt: >-
      כוח קבוע מופעל ב-t = 0 ואינו משתנה עוד לעולם. למתנד יש Q = 10 והוא מתחיל ממנוחה. תארו
      את ההעתק שלאחר מכן.
    choices:
      - text: הוא חורג מעל שיווי המשקל החדש בכ-85% ומצלצל ב-omega_d לפני שהוא מתייצב ב-F0/k.
        correct: true
        feedback: >-
          נכון, וזו ההפתעה המרכזית של המודול. לכוח יש בדיוק תכונה אחת בכל ההיסטוריה שלו,
          ולתגובה יש עשרות. המערכת משיבה בתדירות שלה עצמה לא משנה מה מבקשים ממנה, והחריגה
          exp(-pi gamma / 2 omega_d) תלויה ב-Q בלבד — 85% ב-Q = 10, 44% ב-Q = 2, ואפס
          בריסון קריטי.
      - text: הוא גולש בחלקות עד F0/k בלי לחלוף מעליו לעולם, מפני שהכוח לעולם אינו קטן.
        correct: false
        feedback: >-
          זוהי התפיסה השגויה שהמודול קיים כדי לשבור: ההעתק של מערכת ליניארית אינו עוקב אחרי
          צורת הכוח המופעל עליה. התקרבות מונוטונית היא מה שקורה בריסון קריטי או כבד יותר;
          ב-Q = 10 המסה מגיעה עם מהירות שעליה לאבד, ואיבודה נמשך 2/gamma של צלצול.
      - text: הוא עולה ל-F0/k ונשאר שם מיד, שהרי לכוח קבוע יש תגובה קבועה.
        correct: false
        feedback: >-
          F0/k הוא המקום שבו הוא *מסתיים*, וזו תשובת המצב המתמיד להנעה בתדירות אפס. ההגעה
          לשם היא תגובת מעבר, ותגובת המעבר היא כל תוכן השאלה הזו. למסה יש התמדה, ולכן אין
          היא יכולה לרכוש את מיקומה החדש באופן מיידי.
      - text: הוא מתנודד לנצח סביב F0/k, מפני שהכוח ממשיך לספק אנרגיה.
        correct: false
        feedback: >-
          כוח קבוע אינו מספק אנרגיה נטו ברגע שהמסה חדלה לנוע, והבולם מסלק את מה שיש. הצלצול
          דועך כ-e^(-gamma t/2) בדיוק כפי שדעיכה חופשית דועכת — הוא *אכן* דעיכה חופשית,
          סביב שיווי המשקל המוסט.

  - id: Q-05-4
    type: multiple-choice
    objectives: [OBJ-05-3]
    prompt: >-
      אתם מקליטים דעיכה מצלצלת אחת של מהוד לא מוכר ולוקחים את הערך המוחלט של התמרת פורייה
      שלה. מה קיבלתם?
    choices:
      - text: את גודל תגובת התדר של המהוד — כלומר את עקומת התהודה הסרוקה השלמה של מודול 02, ממכה אחת.
        correct: true
        feedback: >-
          נכון, וזו הסיבה שמהנדסים בודקים מבנים בפטיש ולא במרעיד. ההתמרה של תגובת המתקף היא
          תגובת התדר, ובעיטה אחת מכילה את כל התדירויות בבת אחת, ולכן רשומה בודדת נושאת את
          המשרעת ואת המופע שהסריקה הייתה מודדת נקודה אחר נקודה.
      - text: את הספקטרום של מכת הפטיש, שהרי היא זו שהכניסה את האנרגיה.
        correct: false
        feedback: >-
          הספקטרומים מוכפלים — x-hat = G-hat F-hat — ולכן מה שאתם רואים הוא המכפלה. לבעיטה
          אידיאלית יש ספקטרום שטוח, וזו בדיוק הסיבה שהיא הגשוש השימושי: היא מתחלקת החוצה
          ומשאירה את תגובת המהוד עצמו ודבר מן הפטיש.
      - text: קו חד יחיד ב-omega_d, מפני שהדעיכה המצלצלת היא סינוס דועך בתדירות הזו.
        correct: false
        feedback: >-
          קו ברוחב אפס היה דורש סינוס הנמשך לנצח. הדעיכה היא שנותנת לקו את רוחבו — gamma,
          רוחב מלא בחצי הגובה — והרוחב הזה הוא בדיוק המידע שאתם רוצים, שהרי Q = omega0/gamma.
          דעיכה בזמן היא לורנציאן בתדר.
      - text: שום דבר שימושי בלי להקליט גם את הכוח, שהרי פונקציית תמסורת דורשת קלט ופלט.
        correct: false
        feedback: >-
          נכון באופן כללי, וזו הסיבה שהמתקף מיוחד: ההתמרה שלו היא קבוע ידוע, ולכן הפלט לבדו
          קובע את פונקציית התמסורת עד כדי אותו קבוע. זהו הקלט היחיד שאינכם צריכים למדוד.

  - id: Q-05-5
    type: multiple-choice
    objectives: [OBJ-05-4]
    prompt: >-
      איזו מהתצפיות הבאות הייתה נאסרת על ידי סיבתיות בלבד, בהינתן שהמערכת ליניארית וקבועה
      בזמן?
    choices:
      - text: המסה כבר החלה לנוע שנייה אחת לפני שהכוח הופעל לראשונה.
        correct: true
        feedback: >-
          נכון. סיבתיות היא בדיוק הטענה ש-G(t) = 0 עבור t < 0, שהיא ששמה את הגבול העליון t
          על אינטגרל הקונבולוציה וגורמת ל-x(t) להיות תלוי בכוח רק בזמנים עד t. תנועה לפני
          הכוח היא הדבר היחיד ברשימה הזו שאף בחירה של m, b, k לא הייתה יכולה לייצר.
      - text: המסה עדיין נעה עשר שניות אחרי שהכוח כובה.
        correct: false
        feedback: >-
          מותר לחלוטין, ואופייני: התגובה שורדת את הכוח בערך 2/gamma. זיכרון של העבר אינו
          הפרה של סיבתיות — תלות בעתיד היא ההפרה. זוהי הדעיכה המצלצלת, ובה מודדים את Q.
      - text: ההעתק גדול ביותר ברגע שבו הכוח המופעל מתאפס.
        correct: false
        feedback: >-
          מותר ושגרתי. בתהודה ההעתק מפגר אחרי הכוח ברבע מחזור, ולכן ההעתק השיאי נוחת בדיוק
          היכן שהכוח חוצה את האפס. שום דבר בזה אינו מערב את עתידו של הכוח.
      - text: כוח קצר מייצר תנועה הנמשכת פי אלף מהכוח עצמו.
        correct: false
        feedback: >-
          זוהי תגובת המתקף עצמה, וזו התצפית הפותחת של המודול: הבעיטה נמשכת אלפיות שנייה
          והפעמון מצלצל שניות. סיבתיות מגבילה את הכיוון בזמן שבו ההשפעה נעה, לא את משך
          הזמן שלה.

  - id: Q-05-6
    type: numeric
    objectives: [OBJ-05-5]
    prompt: >-
      במעגל RLC טורי נתונים L = 10 mH, R = 2.0 אוהם ו-C = 1.0 מיקרופאראד. בעזרת המילון
      m <-> L, b <-> R, k <-> 1/C, מהו מקדם הטיב Q של המעגל הזה?
    answer: 50.0
    tolerance: 1.0
    feedback: >-
      Q = sqrt(L/C)/R = sqrt(0.010 / 1.0e-6) / 2.0 = sqrt(10000) / 2.0 = 100/2.0 = 50. אותו
      חשבון כמו sqrt(mk)/b עבור המתנד המכני, מפני שזו אותה משוואה עם שמות אחרים לסמלים.
      תדירות התהודה היא omega0 = 1/sqrt(LC) = 10^4 rad/s, בערך 1.6 kHz.

  - id: Q-05-7
    type: short-answer
    objectives: [OBJ-05-1, OBJ-05-3]
    prompt: >-
      אתם מתמירים דעיכה מצלצלת מדודה ומוסרים את הספקטרום לעמית, שמפעיל עליו אומדן רוחב פס
      בחצי ההספק ומדווח Q = 16 עבור מהוד שידוע לכם שהוא בסביבות Q = 20. הנתונים נקיים
      והאומדן ממומש נכון. מה השתבש, ומה עליהם לעשות במקום?
    discussion: >-
      דבר אינו משובש לא בנתונים ולא בקוד — המלכודת היא רשת התדרים. לרשומה באורך T יש תאים
      במרווח 2 pi / T, בעוד הקו שעליה לפתור הוא ברוחב gamma. השניים אינם בלתי תלויים: רשומה
      המחזיקה n זמני דעיכה של המשרעת היא באורך T = 2n/gamma, ולכן מספר התאים על פני הרוחב
      המלא הוא gamma T / 2 pi = n / pi, בלתי תלוי ב-Q לחלוטין. רשומה מציאותית של שלושה עד
      חמישה זמני דעיכה נותנת אפוא פחות משני תאים על פני הקו, ואינטרפולציה של חציות חצי ההספק
      בין שתי דגימות של עקומה שבקושי דגמתם קוראת נמוך באופן שיטתי.

      הקלטה ארוכה יותר היא המוצא המתבקש והגרוע: עשרה תאים היו דורשים שלושים ואחד זמני דעיכה,
      ובנקודה הזו האות הוא 10^(-14) ממה שהיה בהתחלה וקבור הרבה מתחת לכל רצפת רעש. ריפוד
      באפסים מבצע אינטרפולציה עדינה יותר של צורת הקו אך אינו מוסיף מידע, ולכן הוא משפר את
      המראה יותר מאשר את האומדן.

      הפתרון הוא לחדול משתי נקודות ולהשתמש בכולן: להתאים את כל צורת הלורנציאן, עם תדירות
      השיא והרוחב כפרמטרים חופשיים. זה מה ש-oscillators.q_from_linewidth עושה, וזו הסיבה
      שהיא קיימת לצד q_from_bandwidth, שנשארת הכלי הנכון למדידה סרוקה שבה הנסיין בוחר את
      הדגימה. שימו לב גם שדרך המעטפת, q_from_ringdown, אינה מושפעת מכל זה — היא לעולם אינה
      עוזבת את תחום הזמן — וזו הסיבה שהמעבדה מודדת את Q בשתי הדרכים ומשווה.
