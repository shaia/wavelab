module: 07-normal-modes
questions:
  - id: Q-07-1
    type: multiple-choice
    objectives: [OBJ-07-3]
    prompt: >-
      שרשרת של 12 מסות שוות מוחזקת בין שני קירות קבועים על ידי 13 קפיצים זהים. כמה תדירויות
      שונות של אופני תנודה יש לה?
    choices:
      - text: שתים-עשרה — אחת לכל מסה.
        correct: true
        feedback: >-
          נכון, והספירה כפויה ולא נצפית. לכל מסה יש דרגת חופש אחת, האופנים מהווים בסיס לכל
          התנועות האפשריות, ולבסיס של מרחב 12-ממדי יש 12 איברים. הצורה הסגורה אומרת את אותו
          דבר: p רץ מ-1 עד N, ו-p = N + 1 נותן sin(pi j) = 0 בכל מסה, כלומר אין תנועה כלל.
      - text: שלוש-עשרה — אחת לכל קפיץ.
        correct: false
        feedback: >-
          הקפיצים קובעים את הקשיחות, לא את מספר האופנים. מה שיכול לזוז הוא המסות, ולמערכת עם
          12 דברים שיכולים לזוז יש 12 דרכים בלתי תלויות לזוז. הוסיפו קפיץ בלי להוסיף מסה —
          הקשיחו את הקירות, נניח — והתדירויות ישתנו בעוד המניין יישאר.
      - text: אינסוף, שהרי אפשר להתניע את השרשרת באינסוף דרכים.
        correct: false
        feedback: >-
          אינסוף התנעות, נכון — וכל אחת מהן היא סכום של אותם 12 אופנים. זה בדיוק מה שהופך את
          האופנים לשווים את מציאתם: קבוצה אינסופית של תנועות המתוארת ב-12 מספרים ו-12
          תדירויות.
      - text: שש — האופנים מגיעים בזוגות שווי-תדירות.
        correct: false
        feedback: >-
          זוגות מנוונים הם דבר אמיתי, אבל הם זקוקים לסימטריה שתייצר אותם, ולשרשרת בין שני
          קירות אין סימטריה מן הסוג הנכון. חברו את הקצוות לטבעת והאופנים שמעל אופן האפס אכן
          מזדווגים, מפני שגל שרץ בכיוון אחד סביב הטבעת עולה כמו אותו גל שרץ בכיוון השני.

  - id: Q-07-2
    type: numeric
    objectives: [OBJ-07-3]
    prompt: >-
      לשרשרת עם קצוות קבועים יש N = 4 מסות של m = 0.5 kg המחוברות בקפיצים של k_s = 8.0 N/m.
      מהי התדירות של האופן השני שלה, omega_2, ברדיאן לשנייה?
    answer: 4.702
    tolerance: 0.05
    feedback: >-
      omega_p = 2 sqrt(k_s/m) sin(p pi / (2(N+1))). כאן 2 sqrt(8.0/0.5) = 8.0 rad/s, ועבור
      p = 2, N = 4 מתקבל sin(2 pi / 10) = sin(36 מעלות) = 0.5878, ולכן omega_2 = 4.702 rad/s.
      שתי בדיקות שכדאי לעשות: היא מתחת לתקרה 2 sqrt(k_s/m) = 8.0 rad/s, כפי שחייב להיות לכל
      אופן של כל שרשרת; והיא קטנה מפי שניים omega_1 = 2.472, מפני שהסינוס מתעקל מתחת למשיק שלו
      וההרמוניות של שרשרת קצרה שטוחות בהשוואה לאלה של מיתר.

  - id: Q-07-3
    type: multiple-choice
    objectives: [OBJ-07-4]
    prompt: >-
      יחס הנפיצה של שרשרת הוא omega(k) = 2 sqrt(k_s/m) |sin(k a / 2)|, כאשר a הוא המרווח. איזו
      טענה עליו נכונה?
    choices:
      - text: >-
          העקומה ישרה ליד k = 0 בשיפוע a sqrt(k_s/m), ומתיישרת בקצה הסרט k = pi/a, כך ששום
          תנודה של השרשרת אינה עולה על 2 sqrt(k_s/m).
        correct: true
        feedback: >-
          שני החצאים נכונים. ישרה ליד הראשית פירושה שכל גל ארוך נע באותה מהירות, ולכן פולס
          הבנוי מהם שומר על צורתו — זה המשטר שבו השרשרת מתנהגת כמו מיתר. שטוחה בקצה הסרט
          פירושה שמסות שכנות נמצאות בפאזה הפוכה בדיוק, וזו התנועה האלימה ביותר ששרשרת קפיצים
          מסוגלת לה, ואין דבר מהיר יותר להשיג.
      - text: >-
          התדירות העליונה גדלה ללא גבול כשמוסיפים מסות, שהרי בשרשרת ארוכה יותר נדחסים יותר
          אופנים.
        correct: false
        feedback: >-
          הוספת מסות מוסיפה אופנים, אבל היא מוסיפה אותם *מתחת* לתקרה, ודוחסת את אותה קשת בצפיפות
          רבה יותר. הסינוס אינו יכול לעלות על אחד, ולכן 2 sqrt(k_s/m) חוסם כל שרשרת בכל אורך.
          העלאת התקרה דורשת קפיצים קשיחים יותר או מסות קלות יותר — תווך אחר, ולא עוד מאותו אחד.
      - text: >-
          היחס תלוי במספר המסות, ולכן לשרשרת בת 5 ולשרשרת בת 100 יש עקומות נפיצה שונות.
        correct: false
        feedback: >-
          יש להן אותה עקומה עד כדי חלק אחד ל-10^16, וזו הסיבה שכדאי לתת לה שם. יחס נפיצה הוא
          תכונה של התווך; אורכה של שרשרת מסוימת מחליט רק אילו נקודות של העקומה מותרות,
          k_p = p pi / L.
      - text: >-
          מעבר לקצה הסרט התדירות ממשיכה לטפס, ולכן גלים קצרים מספיק מתנדנדים מהר כרצוננו.
        correct: false
        feedback: >-
          אין מעבר לקצה הסרט שום דבר לטפס אליו. מספרי הגל k ו-k + 2 pi/a מזיזים את המסות באופן
          זהה, ולכן השרשרת אינה יכולה להבחין ביניהם והנוסחה חוזרת על עצמה. זהו שיערוך: טור של
          דוגמים בדידים אינו יכול להבחין בין גל קצר לגל ארוך.

  - id: Q-07-4
    type: multiple-choice
    objectives: [OBJ-07-6]
    misconception: modes-exchange-energy
    prompt: >-
      שרשרת של 20 מסות נמשכת למשולש ומשוחררת, בלי שום ריסון במודל. אתם מחשבים את האנרגיה בכל
      אופן תנודה וצופים בה במשך מאות מחזורי תנודה. מה עושות אנרגיות האופנים?
    choices:
      - text: כל אחת נשארת קבועה בדיוק, בעוד האנרגיה של כל מסה בודדת משתנה ברציפות.
        correct: true
        feedback: >-
          נכון, וזו ההגדרה של אופן תנודה שעושה את עבודתו. כל קואורדינטה מודאלית מקיימת משוואת
          מתנד בלתי תלויה משלה בלי שום התייחסות לאחרות, ולכן אין לאנרגיה שלה עם מי להחליף.
          כשמודדים זאת על אינטגרטור שמעולם לא שמע על אופן, עשרים אנרגיות האופנים מחזיקות עד
          2.5e-4 מערכיהן — והשארית הזו היא של האינטגרטור, ויורדת פי ארבעה כשמחצים את הצעד.
      - text: הן משתוות לאט ככל שהשרשרת מצלצלת, עד שכל עשרים האופנים מחזיקים אותה אנרגיה.
        correct: false
        feedback: >-
          זו האינטואיציה שיש לוותר עליה, ומודול 06 הוא מה ששותל אותה. שתי המטוטלות אכן החליפו
          את האנרגיה שלהן במלואה — אבל בין *אתרים*, בין שני העצמים שיכולתם לראות. בין אופנים
          לא הוחלף דבר גם אז: האופן הסימטרי והאנטי-סימטרי החזיקו כל אחד באנרגיה שלו כל הזמן.
          השתוות הייתה דורשת צימוד בין אופנים, ובמערכת ליניארית אין כזה. הוסיפו קפיץ
          אי-ליניארי והסיפור משתנה, וזה הניסוי של פרמי, פסטה, אולם וצינגו.
      - text: הן מתנדנדות בפאזה הפוכה, בדיוק כמו שתי המטוטלות של מודול 06.
        correct: false
        feedback: >-
          הפעימה בפאזה הפוכה במודול 06 הייתה של אנרגיות שתי ה*מסות*, לא של שני האופנים. קראו
          את אותו מסלול עצמו בתמונת האופנים ותקבלו שני קווים ישרים. שווה להריץ מחדש: תנועה
          אחת, שתי תמונות, ורק באחת מהן משהו זז.
      - text: הן דועכות יחד, שהרי שרשרת שפרטו עליה נעצרת בסופו של דבר.
        correct: false
        feedback: >-
          מיתר אמיתי אכן נעצר, ולמודל הזה אין שום מנגנון לכך — שום איבר ריסון אינו מופיע
          ב-M x'' + K x = 0. האנרגיה הכוללת נשמרת עד לדיוק האינטגרטור לכל אורך הדרך. דעיכה היא
          אפקט פיזיקלי נפרד שמודול 02 מוסיף בכוונה, והוספתו הרשלנית למערכת מצומדת הורסת גם את
          אי-התלות בין האופנים.

  - id: Q-07-5
    type: numeric
    objectives: [OBJ-07-5]
    prompt: >-
      האופן הנמוך ביותר של שרשרת בת N = 10 מסות יושב 0.34% מתחת לתדירות המיתר שאליה הוא
      מתקרב. בהחזקת האורך הכולל קבוע, מהי בקירוב אותה שגיאה יחסית ב-N = 100, באחוזים?
    answer: 0.0040
    tolerance: 0.0012
    feedback: >-
      השגיאה יורדת כ-1/(N+1)^2, ולכן פי עשרה מסות נותנות בערך פי מאה פחות שגיאה: 0.34% הופך
      לכ-0.0034%. אם מדייקים, היחס הוא (11/101)^2 = 1/84, ומכאן 0.0040% — והערך הנמדד הוא
      0.0040%. כל אחד מן האומדנים מקובל; מה שחשוב הוא לזהות חוק מסדר שני ולא ליניארי. אותו
      פיתוח נושא גם p^2, ולכן אופן 16 של אותה שרשרת בת 100 גרוע פי 250 מאופן 1, והאופן העליון
      מכולם אינו מתכנס כלל.

  - id: Q-07-6
    type: short-answer
    objectives: [OBJ-07-1]
    prompt: >-
      סטודנט מוסר לכם את מטריצות המסה והקשיחות M ו-K של מערכת מצומדת כלשהי ושואל כיצד למצוא את
      אופני התנודה שלה. רשמו את הבעיה שיש לפתור, אמרו מה משמעותם הפיזיקלית של שני חלקי התשובה,
      והסבירו מדוע הפותר שמשמש הוא זה שמיועד למטריצות סימטריות ולא שגרת ערכים עצמיים כללית.
    discussion: >-
      הבעיה היא בעיית הערכים העצמיים המוכללת K a = omega^2 M a. היא נובעת מהנחת תנועה שבה הכול
      מתנדנד בתדירות אחת עם תבנית קבועה של משרעות יחסיות, x = a cos(omega t): שתי גזירות מורידות
      -omega^2, הקוסינוס מתחלק, ומה שנשאר הוא המשוואה הזו.

      הערכים העצמיים הם ריבועי תדירויות והווקטורים העצמיים הם צורות האופנים. כך שערך עצמי של
      16 s^-2 פירושו אופן ב-4 rad/s, והווקטור העצמי שלו (1, 0, -1) פירושו תנועה שבה המסה הראשונה
      והשלישית נעות בכיוונים מנוגדים והשנייה אינה זזה כלל. הצורה נושאת יחסים בלבד; קנה המידה
      הכולל הוא המשרעת, שנקבעת בעוצמת ההתנעה של המערכת ולא במטריצות.

      ואשר לשגרה: M מוגדרת חיובית, ולכן היא מתפרקת כ-M = L L^T (כולסקי), והצבת a = L^-T b הופכת
      את הבעיה ל-(L^-1 K L^-T) b = omega^2 b. המטריצה הזו סימטרית, מפני ש-K סימטרית. לבעיית ערכים
      עצמיים סימטרית מובטחים ערכים עצמיים ממשיים ווקטורים עצמיים אורתוגונליים, וזה בדיוק מה
      שהפיזיקה דורשת — תדירויות ממשיות, ואופנים שאינם מפריעים זה לזה. שגרה כללית הייתה מחזירה
      מספרים מרוכבים עם חלקים מדומים זעירים ומשאירה לכם להחליט אם יש להם משמעות, והיא לא הייתה
      מספקת אורתוגונליות כלל.

      שני פרטים שכדאי לציין. האורתוגונליות היא ביחס ל-M ולא ביחס למכפלה הסקלרית הרגילה:
      a_p^T M a_q = delta_pq, וההטלה ששולפת את הקואורדינטות המודאליות נושאת את M איתה מאותה סיבה.
      וערך עצמי אפס אינו שגיאה — למערכת חופשית או צפה יש כזה, וזהו שימור התנע שמופיע כאופן שנסחף
      במקום להתנדנד.

  - id: Q-07-7
    type: numeric
    objectives: [OBJ-07-2]
    prompt: >-
      שתי מסות זהות m מצומדות כך שאופני התנודה שלהן הם המוכרים (1, 1)/sqrt(2) ב-
      omega_s = 4.0 rad/s ו-(1, -1)/sqrt(2) ב-omega_a = 5.0 rad/s. הזוג משוחרר ממנוחה עם
      x1 = 0.10 m ו-x2 = 0. מהו x1, במטרים, ב-t = 1.0 s?
    answer: -0.0185
    tolerance: 0.002
    feedback: >-
      הטלה, קידום, סכימה מחדש — שלושת הצעדים, על המערכת הקטנה ביותר שזקוקה להם.

      הטלה: ההתנעה (0.10, 0) נותנת q_s = a_s . x = 0.10/sqrt(2) ו-q_a = 0.10/sqrt(2), כמויות
      שוות משני האופנים, ושניהם משוחררים ממנוחה ולכן כל qdot מתאפס.

      קידום: כל קואורדינטה מודאלית היא מתנד בלתי תלוי, ולכן
      q_s(t) = (0.10/sqrt2) cos(4t) ו-q_a(t) = (0.10/sqrt2) cos(5t).

      סכימה מחדש: x1 = [q_s + q_a]/sqrt(2) = 0.05 [cos(4t) + cos(5t)]. ב-t = 1.0 s, ברדיאנים,
      cos(4.0) = -0.6536 ו-cos(5.0) = 0.2837, ולכן x1 = 0.05 * (-0.3700) = -0.0185 m.

      המסה הראשונה חלפה על פני האפס ונמצאת עכשיו בצד הרחוק, וזו תחילת מסירת האנרגיה שמודול 06
      מדד את זמנה. שום דבר כאן אינו ייחודי לשתי מסות: אותם שלושה צעדים רצים ללא שינוי עבור
      עשרים, וזה כל העניין במכונה הזו.
