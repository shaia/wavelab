module: 09-wave-energy
questions:
  - id: Q-09-1
    type: multiple-choice
    objectives: [OBJ-09-2]
    misconception: energy-peaks-at-crests
    prompt: >-
      גל סינוסי נע לאורך מיתר. צילום מקפיא אותו. היכן לאורך המיתר, באותו צילום, האנרגיה ליחידת
      אורך גדולה ביותר?
    choices:
      - text: בחציות האפס, שם המיתר תלול ביותר ונע מהר ביותר.
        correct: true
        feedback: >-
          נכון. מיתר אוגר אנרגיה בשתי דרכים ואף אחת מהן אינה הזזה: בהיותו מתוח, מה שדורש שיפוע,
          u_P = (1/2) T (dy/dx)^2, ובהיותו נע, מה שדורש מהירות לרוחב, u_K = (1/2) mu (dy/dt)^2.
          בחציית אפס של סינוס מתקדם שתיהן בשיאן, ובפסגה שתיהן מתאפסות בבת אחת — המיתר שם שטוח
          לרגע ובמנוחה לרגע. נמדד על המיתר המדומה, הפסגה מחזיקה 4e-5 ממה שמחזיקה חציית האפס.
          שימו לב לתוצאה: גבעות האנרגיה מופיעות בתדירות כפולה מזו של הפסגות, מפני שלריבוע יש
          מחצית המחזור של הסינוס.
      - text: בפסגות ובשקעים, שם ההזזה גדולה ביותר.
        correct: false
        feedback: >-
          זו התפיסה השגויה של המודול, והיא באה מהתייחסות להזזה כאילו הייתה אנרגיה אגורה. היא
          אינה. הרימו קטע ישר של מיתר הצידה והחזיקו אותו שם: הזזתם כל נקודה שלו ולא אגרתם דבר,
          מפני שלא מתחתם דבר ושום דבר אינו נע. אנרגיה דורשת שיפוע או מהירות, ולפסגה אין אף אחת
          מהן ברגע שבו הצילום נלקח.
      - text: באופן אחיד לאורך המיתר — גל מתקדם נושא את האנרגיה שלו שווה בשווה.
        correct: false
        feedback: >-
          צפיפות האנרגיה של סינוס מתקדם הולכת כ-sin^2(kx - omega t), שרחוק מלהיות אחיד: היא
          יורדת לאפס פעמיים בכל אורך גל. מה ש*כן* אחיד הוא הממוצע על אורך גל שלם, וזה הגודל
          ש-(1/2) mu v omega^2 A^2 מודדת כשמכפילים אותה ב-v. אחיד בממוצע אינו אחיד בצילום.
      - text: רבע אורך גל לפני כל פסגה, בכיוון ההתקדמות.
        correct: false
        feedback: >-
          מקסימומי האנרגיה אכן יושבים רבע אורך גל מן הפסגות, אבל יש שניים כאלה בכל אורך גל ולא
          אחד, ולאף אחד מהם אין צד מועדף: u הולכת כ-sin^2(kx - omega t), שהמקסימומים שלה שוכנים
          רבע אורך גל משני צדיה של כל פסגה וכל שקע כאחד. שום דבר בצפיפות אינו מבחין בין קדימה
          לאחורה — כיוון ההתקדמות מופיע בסימן השטף, לא במקום שבו נמצאת האנרגיה.

  - id: Q-09-2
    type: multiple-choice
    objectives: [OBJ-09-1]
    prompt: >-
      על מיתר עם v = 20 מ'/ש', לגל סינוסי יש משרעת 2.0 מ"מ ותדירות 50 הרץ. איזו אמירה על שלוש
      המהירויות שלו נכונה?
    choices:
      - text: התבנית והאנרגיה נעות שתיהן ב-20 מ'/ש'; חלקי המיתר נעים הצידה עד 0.63 מ'/ש'.
        correct: true
        feedback: >-
          נכון, ושתי ההתלכדויות אינן מקריות. התבנית נעה ב-v = sqrt(T/mu) מפני שהתווך אומר כך.
          האנרגיה נעה ב-P/u, ועבור גל מתקדם P = v(u_K + u_P) בדיוק, ולכן גם היחס הזה הוא v.
          המהירות לרוחב היא A omega = 0.002 x 2 pi x 50 = 0.63 מ'/ש', נקבעת כולה על ידי מי
          שיצר את הגל, והיא הצידה ולא לאורך. שני מספרים כפויים ואחד הוא כפתור חופשי.
      - text: כל השלוש הן 20 מ'/ש' — זה גל אחד, ולכן יש לו מהירות אחת.
        correct: false
        feedback: >-
          שתיים מהן כן, והשלישית היא 0.63 מ'/ש'. המהירות לרוחב dy/dt היא מה שחלק בודד של מיתר
          עושה, והיא קשורה למהירות הגל דרך y_t = -v y_x: מהירות הגל כפול השיפוע. מכיוון שהשיפוע
          קטן — 0.031 כאן — המיתר זוחל לעומת הגל שלו עצמו. הבלבול בין השניים הוא אותה שגיאה
          כמו לחשוב שגל ביציעים דורש שמישהו ירוץ.
      - text: האנרגיה נעה בחצי ממהירות התבנית, שכן רק חציה קינטית.
        correct: false
        feedback: >-
          שתי הצפיפויות הן כל אחת חצי מן הסך הכול, וזה נכון וזו ההפתעה של המודול — אבל השטף נושא
          את כל הצפיפות, לא חצי ממנה: P = T v y_x^2 = v(u_K + u_P). שני החצאים נעים, והם נעים
          יחד במהירות v. גורם החצי שכן מופיע במודול הזה הוא ב*ממוצע בזמן* של הספק גל סינוסי,
          והוא בא ממיצוע sin^2, לא מחלוקת האנרגיה לשניים.
      - text: המהירות לרוחב היא 20 מ'/ש' והאנרגיה היא זו שנעה ב-0.63 מ'/ש'.
        correct: false
        feedback: >-
          זה הופך את השניים בדיוק, וכדאי לשים לב לכך מפני שזו התחזית של התפיסה השגויה "הגל נושא
          את התווך איתו". גרגר האבק של מודול 08 מכריע: תנועת המיתר עצמו קטנה, הצידה, וחוזרת
          לאפס. תנועת האנרגיה היא מהירות הגל המלאה והיא הולכת לאנשהו.

  - id: Q-09-3
    type: multiple-choice
    objectives: [OBJ-09-5]
    prompt: >-
      לגל מתקדם ולגל עומד יש אותה משרעת ואותה תדירות על מיתרים זהים. על פני מחזור שלם, איזה מהם
      מספק יותר אנרגיה מעבר לנקודה באמצע?
    choices:
      - text: הגל המתקדם. הגל העומד מספק אפס בדיוק, אף שהשטף הרגעי שלו אינו קטן.
        correct: true
        feedback: >-
          נכון, והחלק השני הוא המעניין. עבור y = A sin(kx) cos(omega t) השטף פרופורציוני
          ל-sin(2kx) sin(2 omega t), שגדול כמו רבע מן השיא של הגל המתקדם באותה משרעת — אבל הוא
          מחליף סימן פעמיים במחזור ומתמצע לאפס בכל x. בסימולציה על פני ארבעה מחזורים, השטף
          הממוצע בזמן הגדול ביותר בכל מקום הוא 2.6e-7 מן הרגעי הגדול ביותר. גל עומד מניע אנרגיה
          בסדר גודל דומה ומחזיר את כולה.
      - text: הגל העומד, מפני שהאנרגיה שלו מרוכזת בבטנים במקום להיות פרושה.
        correct: false
        feedback: >-
          האנרגיה שלו אכן מפוזרת באופן לא אחיד, אבל פיזור אינו הובלה. שאלו מה חוצה את נקודת
          האמצע: בגל עומד השטף שם מתנדנד חיובי ושלילי במידה שווה, ולכן הסך על פני מחזור הוא אפס
          בלי קשר לאופן שבו האנרגיה מסודרת. ריכוז והובלה הן שאלות נפרדות, והשטף של המודול הזה
          עונה רק על השנייה.
      - text: שניהם מספקים אותו דבר, שכן יש להם אותה אנרגיה על המיתר.
        correct: false
        feedback: >-
          אכן יש להם אנרגיה בסדר גודל דומה על המיתר — וזה מה שהופך את הניגוד לחד. אנרגיה *אגורה*
          ואנרגיה *מובלת* הן גדלים שונים, וגל עומד הוא מתקן להשגת הראשונה בלי השנייה. מודול 11
          בונה את כל המאזן שלו על ההבחנה הזו.
      - text: "אף אחד: גל אינו מוביל אנרגיה, רק הפרעה."
        correct: false
        feedback: >-
          גל מתקדם מוביל אנרגיה במהירות v בדיוק, וזו התוצאה המרכזית של המודול הזה:
          P = v(u_K + u_P). הדבר שגל אינו מוביל הוא ה*תווך* — גרגר האבק של מודול 08 אינו הולך
          לשום מקום. אנרגיה ותווך הם דברים שונים, וההפרדה ביניהם היא הנקודה של שני המודולים.

  - id: Q-09-4
    type: numeric
    objectives: [OBJ-09-4]
    prompt: >-
      חבל עם mu = 0.080 ק"ג/מ' מוחזק במתיחות של 120 ניוטון. מנער מניע קצה אחד ב-8.0 הרץ במשרעת
      של 25 מ"מ. איזה הספק ממוצע, בוואט, המנער מספק?
    answer: 6.1
    tolerance: 0.2
    feedback: >-
      מהירות הגל היא v = sqrt(120 / 0.080) = sqrt(1500) = 38.7 מ'/ש', והתדירות הזוויתית היא
      omega = 2 pi x 8.0 = 50.3 rad/s. אז <P> = (1/2) mu v omega^2 A^2 =
      0.5 x 0.080 x 38.7 x 50.3^2 x 0.025^2 = 6.1 ואט. שתי בדיקות שכדאי לעשות תוך כדי. הממדים:
      (kg/m)(m/s)(1/s^2)(m^2) = kg m^2/s^3 = W. והסקיילינג: חצו את המשרעת והתשובה יורדת ל-1.5
      ואט, רבע ממה שהייתה, מפני שהשטף ריבועי במהירות לרוחב A omega ושני הסמלים נכנסים רק דרך
      המכפלה הזו.

  - id: Q-09-5
    type: numeric
    objectives: [OBJ-09-3]
    prompt: >-
      בנקודה אחת על מיתר עם מתיחות T = 20 ניוטון, צילום מראה שיפוע dy/dx = +0.015 ומהירות לרוחב
      dy/dt = -0.40 מ'/ש'. מהו שטף האנרגיה P באותה נקודה, בוואט?
    answer: 0.12
    tolerance: 0.005
    feedback: >-
      P = -T (dy/dx)(dy/dt) = -20 x 0.015 x (-0.40) = +0.12 ואט. הסימן הוא הכיוון: האנרגיה
      זורמת לכיוון +x. קראו את הגאומטריה ולא רק את החשבון — המיתר כאן משופע כלפי מעלה ימינה ונע
      כלפי מטה, ולכן החלק שמשמאל מושך את החלק שמימין כלפי מטה בעוד החלק הימני נע מטה, וכוח דרך
      הזזה הוא עבודה חיובית הנעשית על הימני. שימו לב גם למה שהצילום לבדו אינו יכול לומר לכם: אם
      זהו גל הנע ימינה. עבור גל כזה y_t = -v y_x היה נותן v = 0.40/0.015 = 27 מ'/ש', וזה עקבי רק
      אם sqrt(T/mu) של המיתר הוא 27 מ'/ש'. אחרת שני הכיוונים נוכחים כאן.

  - id: Q-09-6
    type: multiple-choice
    objectives: [OBJ-09-4]
    prompt: >-
      פולס הנע ימינה על מיתר נמדד ברגע אחד. נמצא שצפיפות האנרגיה הקינטית שלו וצפיפות האנרגיה
      הפוטנציאלית שלו שוות בכל נקודה, עד לדיוק המדידה. מה זה אומר לכם?
    choices:
      - text: שום דבר מעבר למה שגל מתקדם חייב לעשות — זה נובע מ-y_t = -v y_x ומ-mu v^2 = T.
        correct: true
        feedback: >-
          נכון. עבור גל הנע ימינה כלל השרשרת נותן y_t = -v y_x, ולכן
          u_K = (1/2) mu v^2 y_x^2 = (1/2) T y_x^2 = u_P, כשהצעד האחרון הוא מפני ש-mu v^2 = T זה
          מה ש-v אומר. זה מתקיים בכל נקודה ובכל רגע, בלי שום מיצוע. האמירה אינה ריקה בכל זאת:
          היא נכשלת עבור גל עומד, שבו המיתר כולו פוטנציאלי ברגע אחד וכולו קינטי רבע מחזור אחר
          כך, והיא נכשלת עבור כל סופרפוזיציה של שני כיוונים. שוויון בכל נקודה הוא חתימה של
          תנועה חד-כיוונית.
      - text: שהפולס נמצא במקרה ברגע במחזור שלו שבו שתי הצפיפויות נחתכות.
        correct: false
        feedback: >-
          זו התמונה הנכונה למתנד, והלא נכונה לגל מתקדם. מסה על קפיץ מחליפה קינטית בפוטנציאלית
          פעמיים במחזור והן שוות רק ברגעים בודדים. בגל מתקדם כל אלמנט מפגר מעט אחרי שכנו, ולכן
          מה שהמסה עושה בזה אחר זה המיתר עושה בבת אחת, פרוש לאורכו: השוויון מתקיים בכל רגע, ולא
          ברגעים מיוחדים.
      - text: שהמיתר חייב להיות בלתי נפיץ, אחרת השוויון היה נכשל.
        correct: false
        feedback: >-
          נפיצה אינה מה שנבדק כאן. השוויון נובע מצורה מתקדמת יחידה המקיימת y_t = -v y_x, שנכון
          עבור f(x - vt) יהיה אשר יהיה מה שהתווך עושה לאורכי גל אחרים. מה שנפיצה שוברת הוא
          ה*צורה* — פולס מתפשט, ולכן הוא מפסיק להיות f(x - vt) נוקשה — ורק אז השוויון הולך איתה.
          מודול 13 מטפל בכך.
      - text: שהמדידה שגויה, שכן האנרגיה הכוללת הייתה אז נספרת פעמיים.
        correct: false
        feedback: >-
          שום דבר אינו נספר פעמיים: u_K ו-u_P הן אנרגיות שונות באותו מקום, אחת של תנועה ואחת של
          מתיחה, והסך הכול הוא סכומן. אם כל אחת היא (1/2) T y_x^2 אז הסך הוא T y_x^2, והשטף
          P = T v y_x^2 הוא בדיוק v כפול זה — וזו אמירת המודול שהאנרגיה נעה במהירות הגל. המאזן
          נסגר.

  - id: Q-09-7
    type: short-answer
    objectives: [OBJ-09-3]
    prompt: >-
      הסבירו את חוק השימור המקומי du/dt + dP/dx = 0 במילים: מה כל איבר אומר, מה המשוואה אוסרת,
      ומדוע חוק בצורה הזו אומר יותר מ"אנרגיה נשמרת". אחר כך אמרו מהי האמירה המקבילה עבור קטע
      מיתר בין שני קצוות קבועים.
    discussion: >-
      האיבר הראשון הוא הקצב שבו האנרגיה ליחידת אורך בנקודה משתנה. השני הוא הקצב שבו השטף — ההספק
      החוצה נקודה, P = -T y_x y_t — משתנה כשנעים לאורך המיתר. המשוואה אומרת שהשניים תמיד מתבטלים:
      אנרגיה בנקודה יכולה להשתנות רק מפני שמגיע יותר מצד אחד מכפי שיוצא בשני.

      מה שהיא אוסרת הוא היעלמות אנרגיה כאן והופעתה מחדש שם. אמירה גלובלית, "האנרגיה הכוללת של
      המיתר קבועה", הייתה מתירה זאת: היא מגבילה רק סכום. האמירה המקומית מגבילה כל נקודה, ולכן
      דורשת שהאנרגיה תהיה במקום כלשהו בדרך, ברציפות, בכל רגע של החצייה. זו בדיוק השאלה שהמודול
      נפתח בה — אנרגיה של סערה החוצה אוקיינוס שהמים שלו אינם נעים — ורק חוק מקומי עונה עליה.

      הצורה האינטגרלית הופכת את ההבדל למוחשי. אינטגרציה על קטע [a, b] נותנת d/dt של האנרגיה בקטע
      = P(a) - P(b): מה שנכנס משמאל פחות מה שיוצא מימין. קחו את הקטע להיות מיתר שלם עם שני קצוות
      קבועים. קצה קבוע אינו יכול לנוע, ולכן y_t = 0 שם, ולכן P = 0 בשניהם: שום דבר אינו חוצה אף
      אחד מן הקצוות, והאנרגיה הכוללת קבועה. שימור עבור המיתר כולו הוא תוצאה של החוק המקומי ועוד
      עובדה על השפות, ולא הנחה נפרדת — ולכן אותה מכונה תטפל במיתר עם קצה פתוח, עם צומת, או עם
      מניע, רק על ידי שינוי מהו P בקצוות.

      שווה להוסיף: הצורה הזו — צפיפות, שטף, ומשוואת רציפות — היא הדרך שבה כל גודל נשמר נספר
      מקומית. וקטור פוינטינג במודול 15 וזרם ההסתברות במכניקת הקוונטים הם אותו משפט עם צפיפות
      אחרת.
