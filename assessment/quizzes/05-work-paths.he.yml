module: 05-work-paths
questions:
  - id: Q-05-1
    type: multiple-choice
    objectives: [OBJ-05-1]
    misconception: heat-stored-in-body
    prompt: >-
      גליל של גז מונח על שולחן. איזו שאלה בעלת משמעות ואיזו אינה?
    choices:
      - text: "\"כמה אנרגיה פנימית יש בו?\" בעלת משמעות; \"כמה חום מצוי בו?\" אינה."
        correct: true
        feedback: >-
          נכון. אנרגיה פנימית היא פונקציית מצב, ולכן לגז יש כמות מוגדרת ממנה. חום הוא אחת
          משתי הדרכים שבהן אנרגיה חוצה את הגבול, ולכן הוא שייך לתהליך ולא למצב. גז מכיל
          אנרגיה; הוא אינו מכיל חום.
      - text: שתיהן בעלות משמעות — חום הוא פשוט החלק התרמי של האנרגיה הפנימית.
        correct: false
        feedback: >-
          אין שום דרך לפרק אנרגיה פנימית ל"חלק תרמי" שהגיע כחום ול"חלק מכני" שהגיע כעבודה.
          שני גזים זהים באותו מצב בדיוק יכולים היו להיות מוכנים בתמהילים שונים לחלוטין של
          חימום ודחיסה.
      - text: אף אחת מהן אינה בעלת משמעות, משום ששתיהן תלויות במסלול שנבחר.
        correct: false
        feedback: >-
          אנרגיה פנימית אינה תלויה במסלול — זה בדיוק מה שהופך אותה לפונקציית מצב, וזו הסיבה
          ש-ΔU יוצא זהה בכל מסלול בין שני מצבים.
      - text: "\"כמה חום מצוי בו?\" בעלת משמעות; \"כמה אנרגיה פנימית?\" אינה, משום שלאנרגיה אין אפס מוחלט."
        correct: false
        feedback: >-
          אכן נכון שאנרגיה פנימית נמדדת מנקודת ייחוס שרירותית, אך הדבר משפיע רק על נקודת האפס;
          הפרשים מוגדרים היטב לחלוטין. לחום, לעומת זאת, אין מעמד של פונקציית מצב כלל, אפילו לא
          עד כדי קבוע.

  - id: Q-05-2
    type: multiple-choice
    objectives: [OBJ-05-1, OBJ-05-2]
    prompt: >-
      גז מועבר ממצב א' למצב ב' בשני מסלולים כמו-סטטיים שונים. איזו טענה נכונה תמיד?
    choices:
      - text: ΔU זהה בשני המסלולים; W_on ו-Q עשויים להיות שונים, אך סכומם אינו.
        correct: true
        feedback: >-
          בדיוק. החוק הראשון קושר את שתי פונקציות המסלול לפונקציית מצב אחת: מה שהעבודה לא
          סיפקה, החום חייב להשלים. זהו כל תוכן המודול במשפט אחד.
      - text: W_on זהה בשני המסלולים, משום שנקודות הקצה זהות.
        correct: false
        feedback: >-
          העבודה היא השטח מתחת למסלול במישור P-V, ומסלולים שונים בין אותן נקודות קצה כולאים
          שטחים שונים. בדוגמה הסטנדרטית המסלול הדו-שלבי עולה כארבעים וחמישה אחוזים יותר מן
          האיזותרמה.
      - text: Q זהה בשני המסלולים, משום ששינוי הטמפרטורה זהה.
        correct: false
        feedback: >-
          שינוי הטמפרטורה אכן זהה — הוא פונקציית מצב. אך החום אינו נקבע על ידי ΔT לבדו; הוא
          תלוי גם בכמה עבודה נעשתה בדרך.
      - text: גם W_on וגם Q זהים, משום שהגז אינו יכול לדעת באיזה מסלול עבר.
        correct: false
        feedback: >-
          הגז אכן אינו יכול לדעת — ובדיוק לכן פונקציות ה*מצב* שלו זהות. פונקציות המסלול
          מתארות את מה שהתרחש בגבול, והגבול בהחלט יכול לדעת.

  - id: Q-05-3
    type: multiple-choice
    objectives: [OBJ-05-3]
    prompt: >-
      בשימוש ב-dU = δQ + δW_on, גז מתפשט באופן איזותרמי והפיך. מהם הסימנים של W_on, של Q ושל
      ΔU?
    choices:
      - text: "W_on < 0, Q > 0, ΔU = 0."
        correct: true
        feedback: >-
          נכון. הגז דוחף את הבוכנה החוצה, ולכן העבודה הנעשית עליו שלילית; טמפרטורתו ולכן גם
          אנרגייתו הפנימית אינן משתנות; ולכן חייב לזרום פנימה חום המספק בדיוק את האנרגיה שהגז
          הוציא על סביבתו.
      - text: "W_on > 0, Q < 0, ΔU = 0."
        correct: false
        feedback: >-
          הסימנים הפוכים. במוסכמה שלנו W_on חיובי כשנעשית עבודה על הגז, כלומר בדחיסה. כאן
          מדובר בהתפשטות.
      - text: "W_on < 0, Q = 0, ΔU < 0."
        correct: false
        feedback: >-
          זהו תיאור של התפשטות אדיאבטית, שבה אין זרימת חום והגז מתקרר. כאן הטמפרטורה נשמרת
          קבועה, וזה מחייב זרימת חום פנימה.
      - text: "W_on < 0, Q > 0, ΔU > 0."
        correct: false
        feedback: >-
          עבור גז אידיאלי U תלויה רק בטמפרטורה, והטמפרטורה קבועה, ולכן ΔU חייב להיות אפס
          בדיוק.

  - id: Q-05-4
    type: multiple-choice
    objectives: [OBJ-05-4]
    misconception: dq-dw-exact
    prompt: >-
      מדוע חום נכתב δQ ולא dQ?
    choices:
      - text: משום שאין פונקציה Q של המצב שההפרש שלה נותן את החום שהועבר.
        correct: true
        feedback: >-
          נכון, ומבחן הנגזרות המעורבות הופך זאת לקונקרטי: עבור גז אידיאלי המבחן נכשל עבור δQ,
          ולכן פונקציה כזו אינה קיימת. חלוקה בטמפרטורה מתקנת את הכישלון ומייצרת את האנטרופיה
          — ולכן δQ/T זוכה ל-d כשר.
      - text: משום ש-δ מסמן גודל קטן ואילו d מסמן גודל אינפיניטסימלי.
        correct: false
        feedback: >-
          שני הסימנים מסמנים אינפיניטסימלים. ההבחנה אינה בגודל אלא בשאלה אם האינפיניטסימל הוא
          הדיפרנציאל של פונקציית מצב כלשהי.
      - text: משום שחום אינו נשמר, בניגוד לאנרגיה.
        correct: false
        feedback: >-
          אי-שימור אינו העניין: גם עבודה אינה נשמרת, ואילו נפח נשמר אך הוא מדויק לחלוטין. מה
          שקובע הוא קיומה של פונקציית מצב.
      - text: משום שחום יכול להיות שלילי, ו-d שמור לגדלים חיוביים.
        correct: false
        feedback: >-
          דיפרנציאלים מדויקים הם שליליים באופן שגרתי — dU שלילי בכל פעם שמערכת מאבדת אנרגיה.
          לסימן אין דבר עם מדויקוּת.

  - id: Q-05-5
    type: multiple-choice
    objectives: [OBJ-05-5]
    misconception: reversible-just-backward
    prompt: >-
      בוכנה נטרקת בפתאומיות ודוחסת גז. האם העבודה הנעשית על הגז שווה לשטח מתחת לעקומה במישור
      P-V?
    choices:
      - text: לא — במהלך התהליך אין לגז לחץ יחיד, ולכן אין עקומה לשרטט.
        correct: true
        feedback: >-
          נכון. העבודה היא -∫P_ext dV, לפי הלחץ המופעל בגבול. רק כשהתהליך כמו-סטטי מתקיים
          P_ext = P, ורק אז השטח מתחת לעקומת P-V הוא העבודה.
      - text: כן — העבודה תמיד שווה לשטח מתחת לעקומה, שכן זו ההגדרה.
        correct: false
        feedback: >-
          ההגדרה היא δW_on = -P_ext dV בגבול. כתיבת הלחץ של הגז עצמו שם מבריחה פנימה את ההנחה
          שהגז בשיווי משקל לאורך כל הדרך, והנחה זו מופרת בבוכנה נטרקת.
      - text: כן, בתנאי שהמצב ההתחלתי והמצב הסופי הם מצבי שיווי משקל.
        correct: false
        feedback: >-
          נקודות קצה מוגדרות היטב אינן מספיקות. האינטגרל זקוק ללחץ מוגדר היטב בכל נקודה
          *לאורך* הדרך, ולא רק בקצוות.
      - text: לא — משום שעבודה מוגדרת רק עבור תהליכים הפיכים.
        correct: false
        feedback: >-
          עבודה מוגדרת היטב לחלוטין גם עבור תהליכים בלתי הפיכים; היא פשוט אינה ניתנת על ידי
          השטח מתחת לעקומת P-V של הגז. אחרת לא היה אפשר לנתח מנועים כלל.

  - id: Q-05-6
    type: numeric
    objectives: [OBJ-05-2]
    prompt: >-
      מול אחד של גז אידיאלי בטמפרטורה של 300 קלווין מתפשט באופן איזותרמי והפיך מ-10.0 ליטר
      ל-20.0 ליטר. חשבו את העבודה הנעשית על הגז, ביחידות ג'אול. השתמשו ב-R = 8.314 J/(mol K).
    answer: -1729.0
    tolerance: 15.0
    feedback: >-
      W_on = -nRT ln(V2/V1) = -(1)(8.314)(300) ln 2 = -1729 ג'אול. הסימן שלילי משום שהגז מבצע
      עבודה על סביבתו. אם קיבלתם 1729+, אתם משתמשים במוסכמת הסימנים ההפוכה — לגיטימית במקומות
      אחרים, אך לא בקורס הזה.

  - id: Q-05-7
    type: multiple-choice
    objectives: [OBJ-05-1, OBJ-05-3]
    prompt: >-
      גז מועבר במחזור סגור וחוזר בדיוק למצבו ההתחלתי. מה נכון לגבי מחזור שלם אחד?
    choices:
      - text: ΔU = 0, והעבודה נטו על הגז שווה למינוס החום נטו שנקלט.
        correct: true
        feedback: >-
          נכון — וזה מה שמאפשר קיומם של מנועים. פונקציית המצב חוזרת לערכה, ולכן שתי פונקציות
          המסלול חייבות לקזז זו את זו במקום להתאפס כל אחת בנפרד.
      - text: ΔU, Q ו-W_on כולם אפס, שכן דבר לא השתנה.
        correct: false
        feedback: >-
          רק פונקציית המצב חייבת לחזור לערכה. אילו Q ו-W_on היו מתאפסים סביב כל לולאה, שום
          מנוע לא היה יכול לייצר עבודה נטו — והם בהחלט מייצרים.
      - text: ΔU = 0 וגם W_on = 0, ולכן גם Q = 0.
        correct: false
        feedback: >-
          העבודה נטו סביב לולאה היא מינוס השטח הכלוא, והוא אפס רק עבור לולאה מנוונת חסרת שטח.
          מחזור אמיתי כולא שטח.
      - text: העבודה נטו שווה לשטח מתחת לענף העליון של המחזור.
        correct: false
        feedback: >-
          היא שווה לשטח ה*כלוא* — השטח מתחת לענף העליון פחות השטח מתחת לתחתון, שכן קטע החזרה
          תורם בסימן ההפוך.

  - id: Q-05-10
    type: multiple-choice
    objectives: [OBJ-05-3, OBJ-05-5]
    misconception: adiabatic-constant-t
    prompt: >-
      גז מתפשט באופן אדיאבטי וכמו-סטטי. מה קורה לטמפרטורה שלו?
    choices:
      - text: היא יורדת, משום שהגז מבצע עבודה על סביבתו ואין חום הזורם פנימה כדי להחליף את האנרגיה.
        correct: true
        feedback: >-
          נכון. "אדיאבטי" פירושו Q = 0, ולכן החוק הראשון נותן ΔU = W_on, שהוא שלילי בהתפשטות.
          הגז משלם על העבודה מאנרגייתו הפנימית, ועבור גז אידיאלי האנרגיה הזו היא הטמפרטורה.
      - text: היא נשארת קבועה, משום ש"אדיאבטי" פירושו שאין שינוי בטמפרטורה.
        correct: false
        feedback: >-
          זהו בלבול בין אדיאבטי לאיזותרמי. "אדיאבטי" מגביל את ה*חום* (כלומר Q = 0); "איזותרמי"
          מגביל את ה*טמפרטורה*. אלה אילוצים שונים, ועבור גז מתפשט הם נותנים תשובות הפוכות —
          וזו בדיוק הסיבה ששתי העקומות במישור P-V בעלות שיפועים שונים.
      - text: היא עולה, משום שדחיסת הסביבה מחממת את הגז.
        correct: false
        feedback: >-
          הגז מתפשט ואינו נדחס. *דחיסה* אדיאבטית אכן מעלה את הטמפרטורה, וכך מנוע דיזל מצית את
          דלקו.
      - text: היא נשארת קבועה, משום שאין חום הנכנס או יוצא.
        correct: false
        feedback: >-
          העובדה שאין חום החוצה את הגבול אינה אומרת שאין אנרגיה החוצה אותו. עבודה היא הערוץ
          השני, ולאורך אדיאבטה היא הערוץ היחיד.

  - id: Q-05-8
    type: prediction
    objectives: [OBJ-05-2]
    prompt: >-
      לפני חישוב: גז מתפשט מ-V ל-2V, פעם אחת בלחץ קבוע ופעם אחת בטמפרטורה קבועה, בשני המקרים
      מאותו מצב התחלתי. נבאו איזה מסלול מבצע יותר עבודה על הסביבה, ובאיזה גורם בערך.
    discussion: >-
      המסלול האיזוברי מבצע יותר: הגודל P₁V עבור לחץ קבוע לעומת N k_B T ln 2, שהוא כ-0.69 P₁V
      עבור האיזותרמה, כלומר כארבעים וחמישה אחוזים יותר. הסיבה נראית לעין ללא אלגברה — לאורך
      האיזותרמה הלחץ יורד ככל שהגז מתפשט, ולכן הגז דוחף כנגד פחות ופחות, ואילו המסלול האיזוברי
      משמר את הלחץ ההתחלתי לאורך כל הדרך. מי שניבא את האיזותרמה כנראה חשב על זרימת החום הגדולה
      יותר שלה ולא על השטח מתחת לעקומה.

  - id: Q-05-9
    type: short-answer
    objectives: [OBJ-05-4, OBJ-05-5]
    prompt: >-
      בכמה משפטים, הסבירו לחבר לכיתה מדוע "הפיך" פירושו יותר מ"אפשר להריץ אחורה", בעזרת דוגמה
      קונקרטית שבה אפשר לבטל תהליך עבור המערכת אך לא עבור היקום.
    discussion: >-
      תשובה חזקה מבחינה בין החזרת המערכת לבין החזרת המערכת והסביבה יחד. התפשטות חופשית היא
      הדוגמה הסטנדרטית: גז שהתפשט אפשר בהחלט לדחוס בחזרה לנפחו המקורי, אך הדבר דורש עבודה
      מבחוץ ופולט חום לסביבה, שנותרת משתנה לצמיתות. תהליך הפיך אינו מותיר עקבות כאלה בשום
      מקום. תשובות העוצרות ב"אפשר להריץ את הסרט לאחור" מתארות היפוך זמן של המכניקה, שנכון גם
      עבור ההתפשטות החופשית ולכן אינו יכול להיות התכונה המבחינה.
