module: 00-phasors
questions:
  - id: Q-00-1
    type: multiple-choice
    objectives: [OBJ-00-2]
    misconception: superposition-always-adds
    prompt: >-
      שני רמקולים זהים מייצרים כל אחד, באוזנכם, צליל טהור בעל משרעת A באותה תדירות. אילו
      משרעות מתקבלות אפשריות, בהתאם להפרש המופע ביניהם?
    choices:
      - text: כל ערך בין 0 ל-2A, הנקבע על ידי הפרש המופע.
        correct: true
        feedback: >-
          נכון. השקיל מקיים A_sum^2 = A^2 + A^2 + 2 A^2 cos(delta): 2A כאשר באותו מופע,
          בדיוק 0 כאשר במופעים מנוגדים, וכל דבר בין לבין באחרת. הוספת אות יכולה להשתיק
          אות — כך פועל ביטול הרעש.
      - text: בדיוק 2A — שני מקורות בעלי משרעת A תמיד מתחברים ל-2A.
        correct: false
        feedback: >-
          רק כאשר המופעים תואמים. משרעות אינן נפחי מים; יש להן סימן בכל רגע, ועם היסט של
          חצי מחזור כל דחיפה מרמקול אחד פוגשת משיכה שווה מהשני.
      - text: בין A ל-2A — מקור שני יכול רק להוסיף, לעולם לא להפחית.
        correct: false
        feedback: >-
          זו בדיוק האינטואיציה שהמודול הזה קיים כדי להחליף. בהפרש מופע pi שני האותות
          מתבטלים לחלוטין: סכום של שתי תנודות יכול להיות קטן משתיהן, עד כדי אפס.
      - text: תמיד sqrt(2) A, משום שאותות בלתי מתואמים מתחברים ריבועית.
        correct: false
        feedback: >-
          חיבור ריבועי חל בממוצע על מקורות בעלי *מופע אקראי* (לא-קוהרנטיים). שני
          הרמקולים האלה שומרים על יחס מופע קבוע, כך שכל הטווח מ-0 עד 2A זמין — הערך
          שמתקבל נקבע על ידי delta.

  - id: Q-00-2
    type: multiple-choice
    objectives: [OBJ-00-1, OBJ-00-5]
    prompt: >-
      תחת מוסכמת הקורס, התנודה x(t) = 5 cos(omega t + pi/3) מיוצגת על ידי איזה פאזור?
    choices:
      - text: 5 e^(-i pi/3), חץ באורך 5 בזווית -60 מעלות.
        correct: true
        feedback: >-
          נכון. הפאזור הוא A e^(-i phi), כך ש-Re[פאזור x e^(-i omega t)] משחזר את
          A cos(omega t + phi). סימן המינוס בפאזור מותאם לסיבוב בכיוון השעון
          e^(-i omega t).
      - text: 5 e^(+i pi/3), חץ באורך 5 בזווית +60 מעלות.
        correct: false
        feedback: >-
          זהו הפאזור של המוסכמה ההנדסית (המסתובב נגד כיוון השעון כ-e^(+j omega t)). תחת
          הסיבוב בכיוון השעון של הקורס הזה הוא מייצג 5 cos(omega t - pi/3) — סימן שגוי
          של המופע.
      - text: 5 cos(pi/3) = 2.5, מספר ממשי.
        correct: false
        feedback: >-
          זהו ערך האות ב-t = 0, תמונת מצב אחת. הפאזור חייב לקודד את שני המספרים
          המאפיינים את התנודה — משרעת ומופע — וזה דורש מספר מרוכב, לא ממשי.
      - text: (5, pi/3) — זוג מספרים ממשיים; אין צורך במספר מרוכב.
        correct: false
        feedback: >-
          הזוג אכן רושם את המידע, אך הוא אינו *מתחבר* נכון: חיבור שתי תנודות פירושו
          חיבור הפאזורים שלהן כמספרים מרוכבים, ואף כלל רכיב-אחר-רכיב על זוגות (A, phi)
          אינו עושה זאת.

  - id: Q-00-3
    type: numeric
    objectives: [OBJ-00-2]
    prompt: >-
      לשתי תנודות בנות אותה תדירות יש משרעות 3.0 ו-4.0 והפרש מופע של רבע מחזור
      (delta = pi/2). מהי משרעת הסכום שלהן?
    answer: 5.0
    tolerance: 0.1
    feedback: >-
      A^2 = 3^2 + 4^2 + 2 x 3 x 4 x cos(pi/2) = 9 + 16 + 0 = 25, ולכן A = 5. ברבע מחזור
      האיבר הצולב מתאפס והמשרעות מתחברות כמו צלעות משולש ישר-זווית — משולש 3-4-5, מצויר
      בעזרת חִצים.

  - id: Q-00-4
    type: multiple-choice
    objectives: [OBJ-00-3]
    prompt: >-
      קולן כוונון בתדר 440 הרץ מצלצל יחד עם מיתר הרוטט בתדר 442 הרץ, בעוצמת קול שווה. מה
      אתם שומעים?
    choices:
      - text: צליל סמוך ל-441 הרץ שעוצמת הקול שלו פועמת 2 פעמים בשנייה.
        correct: true
        feedback: >-
          נכון. הסכום הוא נושא בתדירות הממוצעת, 441 הרץ, בתוך מעטפת אטית; עוצמת הקול
          הולכת כמעטפת בריבוע ופועמת בהפרש המלא, 2 הרץ. מוזיקאים מכוונים על ידי האטת
          הפעימות האלה עד לעצירה.
      - text: שני צלילים יציבים נפרדים, ב-440 הרץ וב-442 הרץ.
        correct: false
        feedback: >-
          האוזן אינה יכולה להפריד צלילים הרחוקים 2 הרץ זה מזה — ובכל רגע נתון האוויר
          נושא אות לחץ מסוכם אחד. הסכום הזה הוא תנודה בת 441 הרץ שמשרעתה פועמת לאט:
          פעימות.
      - text: צליל יציב ב-882 הרץ, סכום התדירויות.
        correct: false
        feedback: >-
          תדירויות אינן מתחברות כאשר אותות מתאבכים — אותות מתחברים. תדירות הסכום
          מופיעה רק דרך עיבוד *לא-לינארי*; סופרפוזיציה לינארית מייצרת את התדירות
          הממוצעת, מאופננת בהפרש.
      - text: צליל יציב ב-441 הרץ בעוצמת קול קבועה.
        correct: false
        feedback: >-
          הנושא אכן ב-441 הרץ, אך משרעתו אינה יכולה להיות קבועה: שני הרכיבים נסחפים
          מהסכמה להתנגדות פעם בשנייה על כל הרץ של היסט, ולכן עוצמת הקול חייבת לפעום.
          עוצמת קול קבועה הייתה דורשת תדירויות שוות.

  - id: Q-00-5
    type: multiple-choice
    objectives: [OBJ-00-4]
    prompt: >-
      מאה משדרי רדיו קטנים מספקים כל אחד עוצמת יחידה למקלט מרוחק. השוו את העוצמה
      המתקבלת כאשר המופעים שלהם בלתי תלויים ואקראיים לעומת כאשר הם נעולים יחד.
    choices:
      - text: בערך 100 כאשר אקראי, בדיוק 10,000 כאשר נעול.
        correct: true
        feedback: >-
          נכון. מופעים אקראיים: האיברים הצולבים מתאפסים בממוצע, העוצמות מתחברות,
          ומתקבל N = 100. מופעים נעולים: המשרעות מתחברות ל-N, והעוצמה היא משרעת
          בריבוע, N^2 = 10,000. גורם ה-N הזה ביניהם הוא הסיבה שלייזר מאפיל על מנורה.
      - text: בערך 100 בשני המקרים — ההספק הכולל נקבע על ידי המקורות.
        correct: false
        feedback: >-
          ההספק ה*נפלט* הכולל אכן קבוע, אך נעילת המופעים מכוונת אותו מחדש: המערך הנעול
          מרכז את הפליטה לכיוונים צרים (המקלט הזה ביניהם) על חשבון אחרים. באופן מקומי,
          העוצמה יכולה להגיע ל-N^2.
      - text: בערך 10,000 בשני המקרים, מכיוון שיש 100 מקורות בכל מקרה.
        correct: false
        feedback: >-
          עם מופעים אקראיים חִצי השדה מבצעים הילוך מקרי: משרעת שקיל טיפוסית sqrt(N),
          ומכאן עוצמה N = 100, לא N^2. קבלת N^2 דורשת שהחִצים יהיו מיושרים —
          קוהרנטיות.
      - text: בערך 10 כאשר אקראי — הילוך מקרי של 100 צעדים מגיע בדרך כלל ל-sqrt(100).
        correct: false
        feedback: >-
          sqrt(N) = 10 היא ה*משרעת* הטיפוסית, וזהו היגיון ההילוך המקרי הנכון — אך
          העוצמה היא משרעת בריבוע, ולכן העוצמה הצפויה היא N = 100.

  - id: Q-00-6
    type: multiple-choice
    objectives: [OBJ-00-2]
    misconception: phase-is-unphysical
    prompt: >-
      סטודנט אומר: "מופע הוא רק זווית של הנהלת חשבונות מתמטית — שום דבר פיזיקלי לעולם
      אינו תלוי בו." מהי ההערכה הנכונה?
    choices:
      - text: >-
          הפרשי מופע הם פיזיקה בת-מדידה — הם קובעים התאבכות — בעוד שהמופע המוחלט של
          תנודה בודדת הוא מוסכמה של קביעת השעון.
        correct: true
        feedback: >-
          בדיוק. האם שני גלים מבהירים זה את זה או משתיקים זה את זה נקבע על ידי הפרש
          המופע ביניהם, ואינטרפרומטרים מודדים הפרשים כאלה עד שברים של אורך גל. רק
          המופע הכולל — מתי התחלתם את השעון — הוא עניין של מוסכמה.
      - text: הסטודנט צודק — רק משרעות בנות-מדידה, והמופע לעולם אינו משפיע על שום תצפית.
        correct: false
        feedback: >-
          אוזניות מבטלות רעש מפריכות את זה ממש באוזניכם: האנטי-רעש נבדל מהרעש *רק*
          במופע, והתוצאה היא שקט במקום קול כפול. להפרשי מופע יש השלכות נצפות בקול רם.
      - text: כל המופעים, כולל המופע המוחלט של תנודה בודדת, בני-מדידה בנפרד.
        correct: false
        feedback: >-
          חזק מדי בכיוון ההפוך. המופע המוחלט מקודד את הבחירה של t = 0; הזיזו את השעון
          שלכם והוא משתנה ללא כל השלכה פיזיקלית. מה שניסויים ניגשים אליו הם הפרשי
          מופע.
      - text: מופע משנה רק כאשר המשרעות של שתי התנודות שוות בדיוק.
        correct: false
        feedback: >-
          האיבר הצולב 2 A1 A2 cos(delta) קיים עבור כל שתי משרעות שאינן אפס; משרעות
          שוות רק מאפשרות את המקרה הפרטי של ביטול *מוחלט*. התאבכות אינה זקוקה לשוויון.
