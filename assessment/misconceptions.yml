# Misconception registry (brainstorm §6): each entry is a design requirement, not a footnote.
# assigned_module: which module must confront it with (a) a falsifying experiment and
# (b) a quiz/exam distractor built on the wrong model.
# status: pending | addressed (check_assessment.py verifies addressed ones).
misconceptions:
  - id: superposition-always-adds
    statement: "Two overlapping waves always make a bigger signal."
    assigned_module: 00-phasors
    status: addressed
  - id: phase-is-unphysical
    statement: "Only amplitude is real physics; phase has no measurable consequence."
    assigned_module: 00-phasors
    status: addressed
  - id: amplitude-changes-period
    statement: "A larger amplitude means a longer period."
    assigned_module: 01-sho
    status: addressed
  - id: fastest-at-turning-points
    statement: "The oscillating mass moves fastest at maximum displacement, where the force is biggest."
    assigned_module: 01-sho
    status: addressed
  - id: energy-varies-over-cycle
    statement: "The total energy of an undamped oscillator oscillates in time."
    assigned_module: 01-sho
    status: addressed
  - id: resonance-peak-at-omega0
    statement: "The driven amplitude peaks at exactly the natural frequency, regardless of damping."
    assigned_module: 02-damped-driven
    status: addressed
  - id: resonance-grows-forever
    statement: "Driving an oscillator at resonance makes its amplitude grow without limit."
    assigned_module: 02-damped-driven
    status: addressed
  - id: more-terms-always-converge
    statement: "Adding more Fourier terms makes the approximation better everywhere."
    assigned_module: 03-fourier-series
    status: addressed
  - id: ft-discards-time
    statement: "The Fourier transform throws away the time information in a signal."
    assigned_module: 04-fourier-transform
    status: addressed
  - id: negative-frequency-unphysical
    statement: "Negative frequencies are a mathematical artifact with no physical content."
    assigned_module: 04-fourier-transform
    status: addressed
  - id: response-follows-force-shape
    statement: "A linear system's displacement follows the shape of the force applied to it."
    assigned_module: 05-impulse-response
    status: addressed
  - id: energy-stays-in-excited-pendulum
    statement: "If you start one pendulum of a coupled pair, the energy stays mostly in that pendulum."
    assigned_module: 06-coupled
    status: addressed
  - id: modes-exchange-energy
    statement: "Normal modes trade energy with one another the way the coupled masses do."
    assigned_module: 07-normal-modes
    status: addressed
  - id: wave-carries-medium
    statement: "A travelling wave transports the medium along with it."
    assigned_module: 08-wave-equation
    status: addressed
  - id: speed-set-by-source
    statement: "Shaking harder or faster makes the wave travel faster."
    assigned_module: 08-wave-equation
    status: addressed
  - id: packet-at-phase-velocity
    statement: "A pulse travels at the phase velocity, so a phase velocity above c would break relativity."
    assigned_module: 12-wave-packets
    status: pending
  - id: frequency-changes-in-medium
    statement: "Light entering glass changes its frequency."
    assigned_module: 16-light-in-matter
    status: pending
  - id: third-polarizer-only-dims
    statement: "Inserting an extra polarizer can only ever reduce the transmitted light."
    assigned_module: 20-polarization
    status: pending
  - id: interference-destroys-energy
    statement: "Destructive interference destroys the waves' energy."
    assigned_module: 23-interference
    status: pending
  - id: narrow-slit-narrow-pattern
    statement: "A narrower slit produces a narrower diffraction pattern."
    assigned_module: 29-fraunhofer
    status: pending
