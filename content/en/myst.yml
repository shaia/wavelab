version: 1
project:
  id: thermolab-en
  title: "ThermoLab"
  description: "Explore, derive and simulate thermal physics — an interactive university course"
  keywords: [thermodynamics, statistical mechanics, physics, interactive]
  numbering:
    heading_2: false
  math:
    # project-wide macros so notation is uniform and translations can't drift
    '\dbar': '\delta'
    '\Won': 'W_{\mathrm{on}}'
    '\kB': 'k_{\mathrm{B}}'
  toc:
    - file: index.md
    - title: Foundations
      children:
        - file: foundations/00-orientation.md
        - file: foundations/00-orientation-problems.md
        - file: foundations/math-refresher.md
        - file: conventions.md
    - title: Thermodynamics
      children:
        - file: thermodynamics/04-pressure.md
        - file: thermodynamics/04-pressure-problems.md
        - file: thermodynamics/05-work-paths.md
        - file: thermodynamics/05-work-paths-problems.md
    - title: Statistical mechanics
      children:
        - file: statistical-mechanics/08-multiplicity.md
        - file: statistical-mechanics/08-multiplicity-problems.md
site:
  template: book-theme
  options:
    hide_outline: false
    folders: true
    # The book theme's header prints "Made with MyST" unless logo_text is set; the second
    # "Made with MyST" (sidebar footer) has no option and is hidden in theme/_shared.css.
    logo_text: "ThermoLab"
    # thermolab.css is generated by scripts/build_css.py — the theme loads it itself,
    # which is the only styling hook that survives the app's client-side hydration.
    style: thermolab.css
