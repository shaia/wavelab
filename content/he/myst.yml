version: 1
project:
  id: wavelab-he
  title: "WaveLab — מעבדת גלים"
  description: "לחקור, לגזור ולדמות גלים, תנודות ואופטיקה — קורס אוניברסיטאי אינטראקטיבי"
  keywords: [גלים, תנודות, אופטיקה, התאבכות, עקיפה, פיזיקה]
  numbering:
    heading_2: false
  math:
    '\ii': '\mathrm{i}'
    '\Real': '\operatorname{Re}'
    '\Imag': '\operatorname{Im}'
    '\wnat': '\omega_0'
  toc:
    # Mirrors content/en/myst.yml, minus the pages still listed in translation-pending.txt —
    # MyST fails the build on a TOC entry with no file.
    - file: index.md
    - title: יסודות
      children:
        - file: conventions.md
site:
  template: book-theme
  options:
    hide_outline: false
    folders: true
    # The book theme's header prints "Made with MyST" unless logo_text is set; the second
    # "Made with MyST" (sidebar footer) has no option and is hidden in theme/_shared.css.
    logo_text: "מעבדת גלים"
    # wavelab.css is generated by scripts/build_css.py and carries the RTL rules — the
    # theme loads it itself, which is the only styling hook that survives hydration.
    style: wavelab.css
