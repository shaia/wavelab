version: 1
project:
  id: wavelab-he
  title: "WaveLab — מעבדת גלים"
  description: "לחקור, לגזור ולדמות גלים, תנודות ואופטיקה — קורס אוניברסיטאי אינטראקטיבי"
  keywords: [גלים, תנודות, אופטיקה, התאבכות, עקיפה, פיזיקה]
  numbering:
    heading_2: false
  math:
    '\ii': '\mathrm{i}'
    '\Real': '\operatorname{Re}'
    '\Imag': '\operatorname{Im}'
    '\wnat': '\omega_0'
  toc:
    - file: index.md
    - title: יסודות
      children:
        - file: foundations/00-phasors.md
        - file: foundations/00-phasors-problems.md
        - file: conventions.md
    - title: תנודות
      children:
        - file: oscillations/01-sho.md
        - file: oscillations/01-sho-problems.md
        - file: oscillations/02-damped-driven.md
        - file: oscillations/02-damped-driven-problems.md
    # Part 0 owns these two, but they are taught just in time, after the driven oscillator
    # gives the mathematics a physical engine — see plans/README.md, "Teaching order". The
    # sidebar follows teaching order, so they sit here rather than under Foundations.
    - title: שיטות פורייה
      children:
        - file: foundations/03-fourier-series.md
        - file: foundations/03-fourier-series-problems.md
        - file: foundations/04-fourier-transform.md
        - file: foundations/04-fourier-transform-problems.md
site:
  template: book-theme
  options:
    hide_outline: false
    folders: true
    # The book theme's header prints "Made with MyST" unless logo_text is set; the second
    # "Made with MyST" (sidebar footer) has no option and is hidden in theme/_shared.css.
    logo_text: "WaveLab"
    # wavelab.css is generated by scripts/build_css.py and carries the RTL rules — the
    # theme loads it itself, which is the only styling hook that survives hydration.
    style: wavelab.css
